<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Core Rack Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim app bar + tabbed workspace. Brand: Sunwater cyan (from the logo) on deep navy, Manrope throughout. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --surface-2:#f6f9fa; --ink:#0f2433; --muted:#5a6b76; --line:#dbe3e7;
  --brand:#00b0c9; --brand-ink:#062130; --navy:#0b2433; --navy-ink:#ffffff;
  --accent:#007f93; --accent-ink:#ffffff; --accent-soft:#dcf2f6;
  --warn:#9a4f08; --warn-soft:#fbecd8; --bad:#b3261e; --bad-soft:#f9dedc; --ok:#2b7549; --ok-soft:#dcefe2;
  --hatch:#c6d0d4; --rackframe:#6f8290; --chipS:58%; --chipL:80%; --chipInk:#0f2433;
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1720; --surface:#10212c; --surface-2:#142a37; --ink:#e4eef2; --muted:#93a8b3; --line:#22394a;
  --brand:#18c3db; --brand-ink:#04161f; --navy:#061520; --navy-ink:#ffffff;
  --accent:#3fc9de; --accent-ink:#04161f; --accent-soft:#123845;
  --warn:#f0a95e; --warn-soft:#3b2b17; --bad:#f28b82; --bad-soft:#43201c; --ok:#80d09e; --ok-soft:#1a3424;
  --hatch:#2c4250; --rackframe:#57707f; --chipS:42%; --chipL:36%; --chipInk:#eef3f2; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1720; --surface:#10212c; --surface-2:#142a37; --ink:#e4eef2; --muted:#93a8b3; --line:#22394a;
  --brand:#18c3db; --brand-ink:#04161f; --navy:#061520; --navy-ink:#ffffff;
  --accent:#3fc9de; --accent-ink:#04161f; --accent-soft:#123845;
  --warn:#f0a95e; --warn-soft:#3b2b17; --bad:#f28b82; --bad-soft:#43201c; --ok:#80d09e; --ok-soft:#1a3424;
  --hatch:#2c4250; --rackframe:#57707f; --chipS:42%; --chipL:36%; --chipInk:#eef3f2; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-family:var(--f-display);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
a{color:var(--accent)}

.wrap{padding-inline:16px;max-width:1400px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.grow{flex:1 1 auto;min-width:0}

/* buttons & inputs */
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 12px;cursor:pointer;line-height:1.2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.danger{color:var(--bad)}
button.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad)}
button.icon{padding:4px 8px;font-size:.9rem}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);padding:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select{width:100%}
.field .hint{font-size:.78rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.brandmark{width:22px;height:22px;display:grid;grid-template-rows:repeat(4,1fr);gap:2px;padding:2px;border:2px solid var(--rackframe);border-radius:2px}
.brandmark i{display:block;background:var(--accent);border-radius:1px}
.brandmark i:nth-child(2){background:var(--hatch)}
.crumb{display:flex;gap:8px;align-items:center;min-width:0}
.crumb strong{font-family:var(--f-display);font-size:1.15rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savestate{font-size:.8rem;color:var(--muted)}
.spacer{flex:1}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 14px 9px;font-family:var(--f-display);font-size:.95rem;font-weight:700;color:var(--muted);letter-spacing:0}
.tab:hover{color:var(--ink);border-color:transparent;border-bottom-color:var(--line)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}
.tab .count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-left:4px;font-weight:400}

/* summary strip */
.summary{display:flex;flex-wrap:wrap;gap:6px 22px;padding-block:14px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)}
.stat.bad b{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.notice strong{color:var(--warn)}
.notice.info strong{color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.mono{font-family:var(--f-mono);font-size:.86rem}
tr.blocked td{background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--hatch) 45%,transparent) 6px 8px);color:var(--muted)}
tr.gap td{color:var(--muted);font-style:italic}
tr.empty-slot td{color:var(--muted)}
table.edit td{padding:3px 4px}
table.edit input{width:100%;min-width:60px;padding:5px 7px;border-color:transparent;background:transparent}
table.edit input:hover{border-color:var(--line)}
table.edit input:focus{background:var(--surface);border-color:var(--accent)}
table.edit td.w-s input{min-width:56px;width:64px}
table.edit td.w-m input{min-width:90px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:999px;font-size:.8rem;font-weight:600;background:hsl(var(--h,200) var(--chipS) var(--chipL));color:var(--chipInk);font-family:var(--f-mono)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:600}
.pill.moved{background:var(--warn-soft);color:var(--warn)}
.pill.new{background:var(--ok-soft);color:var(--ok)}
.pill.stage{background:var(--bad-soft);color:var(--bad)}

/* rack elevation */
.shed{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;align-items:flex-end}
.rackcol{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.rackcol:hover .rack{border-color:var(--accent)}
.rackcol .rname{font-family:var(--f-display);font-weight:700;font-size:1rem}
.rackcol .rmeta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.rack{border:3px solid var(--rackframe);border-top-width:5px;border-radius:2px;padding:3px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2);width:112px}
.rack.small{width:62px;border-width:2px;border-top-width:3px;padding:2px;gap:1px}
.cell{height:18px;border-radius:2px;display:flex;align-items:center;gap:4px;padding:0 4px;font-family:var(--f-mono);font-size:.66rem;line-height:1;overflow:hidden;white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
.rack.small .cell{height:7px;padding:0;border-width:0}
.cell .n{color:var(--muted);width:14px;text-align:right;flex:0 0 auto}
.cell.filled{background:hsl(var(--h) var(--chipS) var(--chipL));border-color:transparent;color:var(--chipInk)}
.cell.filled .n{color:inherit;opacity:.6}
.cell.blocked{background:repeating-linear-gradient(-45deg,var(--surface) 0 3px,var(--hatch) 3px 5px);border-color:var(--hatch)}
.cell.gap{border-style:dashed;border-color:var(--muted);background:transparent}
.cell.moved{box-shadow:inset 3px 0 0 var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.legend .sw{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px;border:1px solid var(--line)}

.rackgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:16px;align-items:start}
.racksec > header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0}
.racksec > header h3{font-size:1.25rem}
.racksec .tablewrap{border-radius:0 0 var(--r) var(--r)}

/* home */
.hero{padding-block:36px 8px;display:flex;flex-direction:column;gap:8px}
.hero p{max-width:64ch;color:var(--muted)}
.projlist{display:grid;gap:10px}
.projcard{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.projcard h3{font-size:1.2rem}
.projcard .meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:.85rem}
.projcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){.projcard{grid-template-columns:1fr}.projcard .acts{justify-content:flex-start}}

.featlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.featlist li{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.featlist li.dragover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.featlist .handle{cursor:grab;color:var(--muted);font-size:1rem;user-select:none}
.featlist .pos{font-family:var(--f-mono);color:var(--muted);width:22px;text-align:right}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.mapgrid{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) 70px;gap:8px 10px;align-items:center}
.mapgrid .hdr{font-size:.75rem}

input::placeholder{text-transform:none}
/* wizard */
.wizard{max-width:880px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:18px}
.wizard .intro{display:flex;flex-direction:column;gap:6px}
.wizard .intro p{color:var(--muted);max-width:62ch}
.stepper{display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-weight:600;font-size:.92rem;color:var(--muted);flex-wrap:wrap}
.stepper .st{display:flex;align-items:center;gap:6px}
.stepper .st b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--f-mono);font-size:.72rem;font-weight:500}
.stepper .st.on{color:var(--ink)}
.stepper .st.on b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper .st.done b{border-color:var(--accent);color:var(--accent)}
.stepper .sep{width:18px;height:1px;background:var(--line)}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2)}
.dropzone strong{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
details.manual{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.manual>summary{padding:14px 18px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.manual>summary::-webkit-details-marker{display:none}
details.manual>summary::after{content:"+";font-family:var(--f-mono);font-size:1.2rem;color:var(--muted)}
details.manual[open]>summary::after{content:"−"}
details.manual>.body{padding:0 18px 18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);align-self:flex-start}
.seg label{padding:7px 14px;cursor:pointer;font-weight:500;position:relative}
.seg label+label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.status{font-size:.8rem;font-weight:600;white-space:nowrap}
.status.ok{color:var(--ok)}.status.manual{color:var(--accent)}.status.miss{color:var(--muted);font-weight:500}.status.err{color:var(--bad)}
.matchtable td{vertical-align:middle}
.matchtable select{min-width:190px}
.matchtable input.letter{width:56px;text-transform:uppercase;text-align:center}
.matchtable tr.err td{background:var(--bad-soft)}
.wizfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 12px;border-radius:var(--r);font-size:.88rem;border:1px solid transparent}
.msg.err{background:var(--bad-soft);color:var(--ink);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.msg.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.msg.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.calcline{font-size:1rem}
.calcline .mono{font-size:1.05rem}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:50;max-width:calc(100% - 32px);font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
footer.foot{padding-block:28px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){button,.cell,.tab{transition:border-color .15s,background-color .15s,color .15s}}

/* map, edit sections, locking, projects */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
@media (max-width:920px){.mapwrap{grid-template-columns:1fr}}
.mapcanvas{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);max-height:78vh}
#shedmap{display:block;user-select:none;-webkit-user-select:none}
#shedmap [data-rack],#shedmap [data-rowh],#shedmap [data-label]{touch-action:none}
#shedmap [data-rack].droptarget > rect:first-child{stroke:var(--accent);stroke-width:4}
#shedmap .dragging{opacity:.85}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 116px);display:flex;flex-direction:column;gap:12px}
.side ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.toolbar .field{width:120px}
.modal{position:fixed;inset:0;background:rgba(10,15,18,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:18px;width:min(980px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal img{max-width:100%;height:auto;border:1px solid var(--line);background:#fff;align-self:flex-start}
details.sec>summary .cap{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted);margin-left:10px}
.lockbtn{font-size:.8rem;padding:4px 10px}
.lockbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.slotlock{font-size:.72rem;padding:2px 7px;color:var(--muted)}
.slotlock[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rack.locked{border-color:var(--ink)}
.cell.pinned{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.rowgroup{display:flex;flex-direction:column;gap:8px;padding-right:16px;border-right:1px dashed var(--line);flex:0 0 auto}
.rowgroup:last-child{border-right:0;padding-right:0}
.rowgroup>header{display:flex;align-items:center;gap:10px;justify-content:space-between}
.rowgroup>header .rname{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.rowgroup .racks{display:flex;gap:10px;align-items:flex-end}
.pill.upd{background:var(--warn-soft);color:var(--warn)}
.pill.lock{background:var(--ink);color:var(--surface)}
.pill.held{background:var(--accent-soft);color:var(--accent)}
.pill.draft{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.saved{background:var(--ok-soft);color:var(--ok)}
tr.locked-empty td{color:var(--muted);font-style:italic}
.preview-map{overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:var(--r)}
.projhead{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
@media (max-width:640px){.projhead{grid-template-columns:1fr}}
.projbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.projbox h3{font-size:1.3rem}
.movelist{border-top:1px solid var(--line);padding-top:10px}
.movelist>summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1rem;list-style:none;display:flex;gap:8px;align-items:center}
.movelist>summary::-webkit-details-marker{display:none}
.movelist>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.movelist[open]>summary::before{transform:rotate(90deg)}
.moverow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2)}
@media (max-width:640px){.moverow{grid-template-columns:1fr}}
.moverow .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.moves{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.crumb .sub{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:500}

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
const KEY='coreRackPlanner.v1';
const RW=3,RL=4,AISLE=2,SNAP=1.6;
const $=(s,r=document)=>r.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-3);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coll=new Intl.Collator('en',{numeric:true,sensitivity:'base'});
const nat=(a,b)=>coll.compare(String(a??''),String(b??''));
const numv=v=>{if(v===''||v==null)return Infinity;const n=parseFloat(v);return isNaN(n)?Infinity:n;};
const colLetter=i=>{let s='';i=i+1;while(i>0){const r=(i-1)%26;s=String.fromCharCode(65+r)+s;i=Math.floor((i-1)/26);}return s;};
const letterToIdx=s=>{s=String(s||'').trim().toUpperCase();if(!s)return -1;if(/^\d+$/.test(s))return (+s)-1;if(!/^[A-Z]+$/.test(s))return -2;let n=0;for(const ch of s)n=n*26+(ch.charCodeAt(0)-64);return n-1;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const int=(v,d)=>{const n=parseInt(v,10);return isNaN(n)?d:n;};
const clone=o=>JSON.parse(JSON.stringify(o));
const plural=(n,w,ws)=>`${n} ${n===1?w:(ws||w+'s')}`;
const fmtDate=t=>t?new Date(t).toLocaleString([], {day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'';
const LIGHT={bg:'#f6f9fa',grid:'#e1e8eb',frame:'#6f8290',surface:'#ffffff',ink:'#0f2433',muted:'#5a6b76',accent:'#00a3bb',warn:'#9a4f08',lockfill:'#e4e7e4',chipS:'58%',chipL:'74%'};
function pal(){try{const cs=getComputedStyle(document.documentElement);const g=n=>cs.getPropertyValue('--'+n).trim();
  const o={bg:g('surface-2'),grid:g('line'),frame:g('rackframe'),surface:g('surface'),ink:g('ink'),muted:g('muted'),accent:g('accent'),warn:g('warn'),lockfill:g('hatch'),chipS:g('chipS'),chipL:g('chipL')};
  return o.ink?o:LIGHT;}catch(e){return LIGHT;}}

/* ---------- state ----------
   A project holds the saved shed state (plan). Core moves hold working copies (plan) that are saved back into the project.
   A plan: {name, stage, setup, racks (bays), map, customCols, options, items}. Bays: {id,name,rows (slots),blocked,x,y,locked,fixed,slotLocks,hold}. */
const S={projects:[],seeded:false,view:'home',ctx:null,tab:'plan',q:'',confirm:null,imp:null,dirty:false,drag:null,storageOk:true,
  addMode:'range',manualOpen:false,open:{},sel:null,updated:{},zoom:26,renaming:null,newMoveFor:null,focusAfter:null,modal:null,homeOpen:{},filter:{q:'',conds:[],onlyMatches:true},filterOpen:false,match:null};

function defaultsPlan(){return{
  stage:'done',setup:{rackCount:0,defaultRows:'',defaultBlocked:'',letter:'A',startNum:1,rowCount:1,backToBack:false,autoCount:true},
  racks:[],map:{title:'',w:0,h:0,labels:[]},customCols:[],
  options:{useCustomOrder:false,featureOrder:[],gapAfterHole:0,gapAfterFeature:0,newRackPerFeature:false},items:[]};}
function makeRack(p){return{id:uid(),name:'',rows:int(p.setup.defaultRows,12)||12,blocked:parseRows(p.setup.defaultBlocked),x:0,y:0,locked:false,fixed:{},slotLocks:{},hold:{}};}
function newPlan(name){const p=defaultsPlan();p.name=name;p.stage='holes';return p;}
function newProjectRec(name,site){const now=Date.now();return{id:uid(),name:name||'Untitled project',site:site||'',created:now,updated:now,plan:null,moves:[]};}
function newMoveRec(name,plan){const now=Date.now();return{id:uid(),name:name||'Core move',created:now,updated:now,savedAt:0,plan};}

function examplePlan(name){
  const p=defaultsPlan();p.name=name;
  p.setup.defaultRows='12';p.setup.defaultBlocked='1-2';p.setup.rowCount=2;p.setup.autoCount=false;
  p.racks=Array.from({length:6},()=>makeRack(p));autoLayout(p.racks,2,false);p.setup.rackCount=6;
  p.map.title='Core shed 2';p.map.labels=[{id:uid(),x:2,y:16,text:'Roller door'}];
  const col={id:uid(),name:'Core size'};p.customCols=[col];
  const holes=[['ZXY','DD101',4,'NQ'],['BMA2','DD109',5,'HQ'],['BMA1','DD101',4,'HQ'],['BMA2','DD105',3,'HQ'],['BMA1','DD100',6,'HQ']];
  holes.forEach(([f,h,n,size],hi)=>{let d=0;for(let b=1;b<=n;b++){const len=4.6+((b*7+hi*3)%9)/10;const from=d;d=+(d+len).toFixed(2);
    p.items.push({id:uid(),feature:f,hole:h,box:String(b),of:String(n),from:from.toFixed(2),to:d.toFixed(2),custom:{[col.id]:size}});}});
  deriveNames(p);return p;}
function exampleProject(){
  const pr=newProjectRec('Example: Shed 2','Example data, safe to delete');pr.plan=examplePlan(pr.name);
  const mv=newMoveRec('Add BMA1-DD102',clone(pr.plan));mv.plan.name=pr.name+' – '+mv.name;
  const col=mv.plan.customCols[0];for(let b=1;b<=3;b++)mv.plan.items.push({id:uid(),feature:'BMA1',hole:'DD102',box:String(b),of:'3',from:'',to:'',custom:{[col.id]:'HQ'}});
  pr.moves.push(mv);return pr;}

/* ---------- storage & migration ---------- */
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(Array.isArray(d.projects))S.projects=d.projects.map(migrateRecord).filter(Boolean);S.seeded=!!d.seeded;}}
  catch(e){S.storageOk=false;}
  if(!S.seeded&&!S.projects.length){S.projects=[exampleProject()];S.seeded=true;persist();}
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify({version:2,projects:S.projects,seeded:true}));S.storageOk=true;}catch(e){S.storageOk=false;}
  const el=$('#savestate');if(el)el.textContent=saveText();
}
function saveText(){return S.storageOk?'Saved in this browser':'Not saved in this browser. Use Export → Project file.';}
function migrateRecord(r){
  if(!r)return null;
  if(Array.isArray(r.moves)){r.plan=r.plan?normalisePlan(r.plan):null;r.moves=r.moves.map(m=>Object.assign({savedAt:0},m,{plan:normalisePlan(m.plan)}));return r;}
  // old single-plan project
  const pr={id:r.id||uid(),name:r.name||'Untitled project',site:r.site||'',created:r.created||Date.now(),updated:r.updated||Date.now(),plan:null,moves:[]};
  const plan=normalisePlan(r);
  if(plan.stage==='done')pr.plan=plan;else{const m=newMoveRec('Initial setup',plan);pr.moves.push(m);}
  return pr;
}
function normalisePlan(p){const d=defaultsPlan();p.setup=Object.assign(d.setup,p.setup||{});p.options=Object.assign(d.options,p.options||{});
  const hadXY=(p.racks||[]).every(r=>typeof r.x==='number'&&typeof r.y==='number');
  p.racks=(p.racks||[]).map(r=>({id:r.id||uid(),name:r.name||'',rows:+r.rows||0,blocked:Array.isArray(r.blocked)?r.blocked:parseRows(r.blocked),x:+r.x||0,y:+r.y||0,
    locked:!!r.locked,fixed:r.fixed||r.lock||{},slotLocks:r.slotLocks||{},hold:r.hold||{}}));
  if(!hadXY||p.layout){ // old row-based layout → bay positions
    const rows=(p.layout&&Array.isArray(p.layout.rows))?p.layout.rows:[{x:2,y:2,width:1,rackIds:p.racks.map(r=>r.id)}];const byId=new Map(p.racks.map(r=>[r.id,r]));
    rows.forEach(row=>{const n=row.rackIds.length,cols=row.width===2?2:1,len=Math.max(1,Math.ceil(n/cols));row.rackIds.forEach((id,k)=>{const r=byId.get(id);if(!r)return;const col=cols===2&&k>=len?1:0;r.x=row.x+col*RW;r.y=row.y+(col?k-len:k)*RL;});});
    delete p.layout;}
  p.map=Object.assign({title:'',w:0,h:0,labels:[]},p.map||{});if(!Array.isArray(p.map.labels))p.map.labels=[];
  p.customCols=p.customCols||[];p.items=(p.items||[]).map(it=>Object.assign({id:uid(),feature:'',hole:'',box:'',of:'',from:'',to:'',custom:{}},it));
  delete p.baseline;p.stage=p.stage||'done';deriveNames(p);return p;}

const projRec=()=>S.ctx&&S.projects.find(x=>x.id===S.ctx.pid);
const moveRec=()=>{const pr=projRec();return pr&&S.ctx.mid?pr.moves.find(m=>m.id===S.ctx.mid):null;};
const cur=()=>{const pr=projRec();if(!pr)return null;if(S.ctx.mid){const m=moveRec();return m?m.plan:null;}return pr.plan;};
const isReadOnly=()=>!!(S.ctx&&!S.ctx.mid);
function touch(p){const pr=projRec();const now=Date.now();if(pr){pr.updated=now;const m=moveRec();if(m)m.updated=now;}persist();}

/* ---------- helpers ---------- */
function parseRows(str){if(Array.isArray(str))return str;const out=new Set();String(str||'').split(/[,;\s]+/).forEach(t=>{if(!t)return;const m=t.match(/^(\d+)-(\d+)$/);
  if(m){let a=+m[1],b=+m[2];if(a>b)[a,b]=[b,a];for(let i=a;i<=b&&i-a<1000;i++)out.add(i);}else if(/^\d+$/.test(t))out.add(+t);});
  return[...out].sort((a,b)=>a-b);}
function fmtRows(arr){if(!arr||!arr.length)return'';const a=[...arr].sort((x,y)=>x-y),out=[];let s=a[0],e=a[0];
  for(let i=1;i<=a.length;i++){if(a[i]===e+1){e=a[i];continue;}out.push(s===e?String(s):s+'-'+e);s=e=a[i];}return out.join(', ');}
function letterAdd(L,i){let code=0;for(const ch of L)code=code*26+(ch.charCodeAt(0)-64);code+=i;let s='';while(code>0){const r=(code-1)%26;s=String.fromCharCode(65+r)+s;code=Math.floor((code-1)/26);}return s;}
function rackName(setup,i){const L=(String(setup.letter||'A').toUpperCase().replace(/[^A-Z]/g,''))||'A';const n=parseInt(setup.startNum,10);const start=isNaN(n)?1:n;
  return setup.pattern==='letter'?letterAdd(L,i)+start:L+(start+i);}
function featureOrder(p){
  const feats=[...new Set(p.items.map(i=>i.feature||''))].sort((a,b)=>(a===''?1:0)-(b===''?1:0)||nat(a,b));
  if(!p.options.useCustomOrder)return feats;
  const custom=(p.options.featureOrder||[]).filter(f=>feats.includes(f));
  return custom.concat(feats.filter(f=>!custom.includes(f)));}
const fname=f=>f===''?'(no feature)':f;


const cleanLetter=L=>(String(L||'A').toUpperCase().replace(/[^A-Z]/g,''))||'A';

/* ---------- layout: bays placed on a grid; touching bays form a row ---------- */
const touching=(a,b)=>((a.x+RW===b.x||b.x+RW===a.x)&&a.y<b.y+RL&&b.y<a.y+RL)||((a.y+RL===b.y||b.y+RL===a.y)&&a.x<b.x+RW&&b.x<a.x+RW);
const overlap=(a,b)=>a.x<b.x+RW&&b.x<a.x+RW&&a.y<b.y+RL&&b.y<a.y+RL;
function rowGroups(p){
  const bays=p.racks;const parent=bays.map((_,i)=>i);const find=i=>parent[i]===i?i:(parent[i]=find(parent[i]));
  for(let i=0;i<bays.length;i++)for(let j=i+1;j<bays.length;j++)if(touching(bays[i],bays[j])){const a=find(i),b=find(j);if(a!==b)parent[a]=b;}
  const m=new Map();bays.forEach((b,i)=>{const k=find(i);if(!m.has(k))m.set(k,[]);m.get(k).push(b);});
  const groups=[...m.values()].map(list=>{list.sort((a,b)=>a.x-b.x||a.y-b.y);const minX=Math.min(...list.map(b=>b.x)),minY=Math.min(...list.map(b=>b.y)),maxX=Math.max(...list.map(b=>b.x+RW));return{bays:list,minX,minY,maxX};});
  groups.sort((a,b)=>a.minX-b.minX||a.minY-b.minY);return groups;}
function deriveNames(p){
  const first=cleanLetter(p.setup.letter),start=int(p.setup.startNum,1);const ordered=[];
  const groups=rowGroups(p);
  groups.forEach((g,i)=>{g.letter=letterAdd(first,i);g.key=g.bays[0].id;g.bays.forEach((r,k)=>{r.name=g.letter+(start+k);r.rowKey=g.key;r.rowLetter=g.letter;ordered.push(r);});});
  p.racks=ordered;Object.defineProperty(p,'_rows',{value:groups,writable:true,configurable:true,enumerable:false});return groups;
}
function autoLayout(bays,R,b2b){
  R=clamp(R|0,1,Math.max(1,bays.length));const per=Math.ceil(bays.length/R)||1;let x=2;
  for(let i=0;i<R;i++){const list=bays.slice(i*per,(i+1)*per);if(!list.length)break;const cols=b2b&&list.length>1?2:1;const len=Math.ceil(list.length/cols);
    list.forEach((b,k)=>{const col=cols===2&&k>=len?1:0;b.x=x+col*RW;b.y=2+(col?k-len:k)*RL;});x+=cols*RW+AISLE;}
}
function freeAt(p,x,y,except){const t={x,y};return x>=0&&y>=1&&!p.racks.some(o=>(!except||!except.has(o.id))&&overlap(t,o));}
function appendBayToRow(p,bay,group){
  if(!group){const gs=rowGroups(p);const maxX=gs.length?Math.max(...gs.map(g=>g.maxX)):0;bay.x=gs.length?maxX+AISLE:2;bay.y=2;return;}
  const cols=new Map();group.bays.forEach(b=>{if(!cols.has(b.x))cols.set(b.x,[]);cols.get(b.x).push(b);});
  const col=[...cols.entries()].sort((a,b)=>a[1].length-b[1].length||a[0]-b[0])[0];
  let y=Math.max(...col[1].map(b=>b.y))+RL;while(!freeAt(p,col[0],y)&&y<2000)y+=RL;bay.x=col[0];bay.y=y;}
function swapRacks(p,a,b){const A=p.racks.find(r=>r.id===a),B=p.racks.find(r=>r.id===b);if(!A||!B)return;[A.x,B.x]=[B.x,A.x];[A.y,B.y]=[B.y,A.y];}
function magnet(p,bay,fx,fy){
  let best=null,bd=SNAP;
  p.racks.forEach(o=>{if(o.id===bay.id)return;[[o.x,o.y+RL],[o.x,o.y-RL],[o.x+RW,o.y],[o.x-RW,o.y]].forEach(([cx,cy])=>{const d=Math.hypot(cx-fx,cy-fy);if(d<bd){bd=d;best={x:cx,y:cy};}});});
  return best||{x:Math.round(fx),y:Math.round(fy)};}
function nameSnapshot(p){deriveNames(p);return new Map(p.racks.map(r=>[r.id,r.name]));}
function markUpdated(p,before){deriveNames(p);p.racks.forEach(r=>{const old=before.get(r.id);if(old===undefined||old===r.name)return;
  const orig=S.updated[r.id]!==undefined?S.updated[r.id]:old;if(orig===r.name)delete S.updated[r.id];else S.updated[r.id]=orig;});}
function mapBounds(p){let w=0,h=0;p.racks.forEach(r=>{w=Math.max(w,r.x+RW);h=Math.max(h,r.y+RL);});
  (p.map.labels||[]).forEach(l=>{w=Math.max(w,l.x+Math.ceil(String(l.text).length*0.4)+2);h=Math.max(h,l.y+1);});
  return{w:Math.max(int(p.map.w,0),w+2,12),h:Math.max(int(p.map.h,0),h+2,10)};}

/* ---------- locking ----------
   Locked bay: keeps exactly its boxes (fixed). Locked slot: keeps its box, or stays empty.
   Unlocking keeps boxes where they are (held) until "Update to best positions" is pressed. */
function lockBays(p,ids,on){const P=computePlan(p);ids.forEach(id=>{const r=p.racks.find(x=>x.id===id);if(!r)return;
  if(on){const R=P.racks.find(x=>x.rack.id===id);r.fixed={};if(R)R.cells.forEach(c=>{if(c.item)r.fixed[c.slot]=c.item.id;});r.locked=true;r.hold={};}
  else{r.hold=Object.assign({},r.fixed);r.fixed={};r.locked=false;}});}
function lockSlot(p,id,slot){const r=p.racks.find(x=>x.id===id);if(!r)return;const P=computePlan(p);const R=P.racks.find(x=>x.rack.id===id);const c=R&&R.cells[slot-1];
  if(r.slotLocks[slot]!==undefined){const it=r.slotLocks[slot];delete r.slotLocks[slot];if(it)r.hold[slot]=it;return false;}
  r.slotLocks[slot]=c&&c.item?c.item.id:'';delete r.hold[slot];return true;}
const heldCount=p=>p.racks.reduce((n,r)=>n+(r.locked?0:Object.keys(r.hold||{}).length),0);
function reoptimise(p){p.racks.forEach(r=>{if(!r.locked)r.hold={};});}

/* ---------- planning engine ---------- */
function computePlan(p){
  deriveNames(p);
  const feats=featureOrder(p);
  const rank=new Map(feats.map((f,i)=>[f,i]));
  const hue=new Map(feats.map((f,i)=>[f,Math.round((i*137.508+192)%360)]));
  const sorted=[...p.items].sort((a,b)=>(rank.get(a.feature||'')-rank.get(b.feature||''))||nat(a.hole,b.hole)||(numv(a.box)-numv(b.box))||(numv(a.from)-numv(b.from))||(numv(a.to)-numv(b.to))||nat(a.id,b.id));
  const o=p.options;const byId=new Map(p.items.map(i=>[i.id,i]));
  const racks=p.racks.map(r=>({rack:r,used:0,locked:!!r.locked,cells:Array.from({length:Math.max(0,r.rows|0)},(_,i)=>({slot:i+1,blocked:(r.blocked||[]).includes(i+1),item:null,gap:false,closed:false,pin:''}))}));
  const pos={},pinned=new Set();let held=0;
  const place=(R,c,it)=>{c.item=it;R.used++;pos[it.id]={rackId:R.rack.id,rackName:R.rack.name,slot:c.slot,key:R.rack.id+'|'+c.slot};};
  const pin=(R,slot,id,kind)=>{const c=R.cells[(+slot)-1];if(!c||c.blocked)return false;c.closed=true;c.pin=kind;const it=byId.get(id);if(!it||pinned.has(id)||c.item)return true;place(R,c,it);pinned.add(id);if(kind==='held')held++;return true;};
  racks.forEach(R=>{const r=R.rack;
    if(r.locked){R.cells.forEach(c=>{c.closed=true;});Object.entries(r.fixed||{}).forEach(([s,id])=>pin(R,s,id,'bay'));return;}
    Object.entries(r.slotLocks||{}).forEach(([s,id])=>pin(R,s,id,'slot'));
    Object.entries(r.hold||{}).forEach(([s,id])=>{const c=R.cells[(+s)-1];if(!c||c.closed||c.blocked||!byId.has(id)||pinned.has(id))return;pin(R,s,id,'held');});});
  const pool=sorted.filter(it=>!pinned.has(it.id));
  let ri=0,si=0;
  const next=()=>{while(ri<racks.length){if(racks[ri].locked){ri++;si=0;continue;}const c=racks[ri].cells;while(si<c.length&&(c[si].blocked||c[si].closed))si++;if(si<c.length)return c[si];ri++;si=0;}return null;};
  const skip=n=>{for(let k=0;k<n;k++){const c=next();if(!c)return;c.gap=true;si++;}};
  const unplaced=[];let prev=null;
  for(const it of pool){
    if(prev){const nf=(prev.feature||'')!==(it.feature||''),nh=nf||prev.hole!==it.hole;
      if(nf&&o.newRackPerFeature){next();if(ri<racks.length&&racks[ri].used>0){ri++;si=0;}}
      else if(nf)skip(Math.max(+o.gapAfterFeature||0,+o.gapAfterHole||0));
      else if(nh)skip(+o.gapAfterHole||0);}
    prev=it;
    const c=next();if(!c){unplaced.push(it);continue;}
    place(racks[ri],c,it);si++;
  }
  let usable=0,gaps=0,free=0;racks.forEach(R=>R.cells.forEach(c=>{if(c.blocked)return;usable++;if(c.gap)gaps++;else if(!c.item&&!c.closed)free++;}));
  const rowList=p._rows.map(g=>({row:g,racks:g.bays.map(b=>racks.find(R=>R.rack.id===b.id)).filter(Boolean)}));
  return{sorted,racks,rowList,pos,unplaced,hue,feats,usable,gaps,placed:sorted.length-unplaced.length,free,pinned:pinned.size,held};
}

/* moves = differences between this core move and the saved project */
function computeMoves(p,P){
  if(!S.ctx||!S.ctx.mid)return null;const pr=projRec();if(!pr||!pr.plan)return null;
  const BP=computePlan(pr.plan);const base=BP.pos;const baseItems=new Map(pr.plan.items.map(i=>[i.id,i]));
  const nm=new Map(p.racks.map(r=>[r.id,r.name]));const fix=b=>b?Object.assign({},b,{rackName:nm.get(b.rackId)||b.rackName}):b;
  const ids=new Set(p.items.map(i=>i.id));
  const removed=Object.entries(base).filter(([id])=>!ids.has(id)).map(([id,b])=>({kind:'remove',item:baseItems.get(id)||{},from:fix(b),to:null}));
  const pending=[];const noSpace=[];const basePos={};
  for(const it of P.sorted){const c=P.pos[it.id],b=fix(base[it.id]);if(b)basePos[it.id]=b;
    if(!c){noSpace.push(it);continue;}
    if(!b)pending.push({kind:'new',item:it,from:null,to:c});
    else if(b.key!==c.key)pending.push({kind:'move',item:it,from:b,to:c});}
  const occ=new Map();
  for(const [id,b] of Object.entries(base))if(ids.has(id))occ.set(b.key,id);
  const steps=[...removed];removed.forEach(m=>{});const work=pending.slice();let guard=0;
  while(work.length&&guard++<10000){
    let progressed=false;
    for(let i=0;i<work.length;i++){const m=work[i];const o=occ.get(m.to.key);
      if(o===undefined||o===m.item.id){if(m.from&&m.from.key&&occ.get(m.from.key)===m.item.id)occ.delete(m.from.key);occ.set(m.to.key,m.item.id);steps.push(m);work.splice(i,1);i--;progressed=true;}}
    if(!progressed){const m=work[0];steps.push({kind:'stage',item:m.item,from:m.from,to:{label:'Staging area',key:'__stage_'+m.item.id}});
      if(m.from&&m.from.key)occ.delete(m.from.key);m.from={label:'Staging area',key:'__stage_'+m.item.id};m.kind='unstage';}
  }
  const moved=new Set(pending.filter(m=>m.kind!=='new').map(m=>m.item.id));
  return{steps,noSpace,moved,basePos,newIds:new Set(pending.filter(m=>m.kind==='new').map(m=>m.item.id)),count:pending.length,removed:removed.length};
}
const loc=x=>!x?'Incoming':x.label?x.label:`${x.rackName}-${x.slot}`;

    if(c.op==='gte')return x>=a;if(c.op==='lte')return x<=a;if(c.op==='between'){const hi=isNaN(b)?a:b;return x>=Math.min(a,hi)&&x<=Math.max(a,hi);}return x===a;}

  const usable=rows-bl.filter(b=>b<=rows).length;if(!(usable>0))return 0;if(!p.items.length)return 1;
  for(let n=Math.max(1,Math.ceil(p.items.length/usable));n<=500;n++){const racks=Array.from({length:n},(_,i)=>({id:'t'+i,name:'',rows,blocked:bl,x:2,y:2+i*RL,locked:false,fixed:{},slotLocks:{},hold:{}}));
    const t=Object.assign({},p,{racks});if(!computePlan(t).unplaced.length)return n;}return 500;}

  p.racks=genRacks(p,n);const R=clamp(int(p.setup.rowCount,1),1,n);p.setup.rowCount=R;autoLayout(p.racks,R,!!p.setup.backToBack);deriveNames(p);}

const normH=s=>String(s??'').toLowerCase().replace(/[^a-z0-9#]/g,'');

function autoMap(p,imp){

function buildImport(p,imp,rows){
  const m=imp.map;const get=(row,k)=>{const i=m[k];return i>=0&&row[i]!=null?String(row[i]).trim():'';};
  const hdr=imp.headerRow>0?(imp.rows[imp.headerRow-1]||[]):[];
  const mappedIdx=new Set(Object.values(m).filter(v=>v>=0));
  const extraCols=[];
  if(imp.extras){const ncols=Math.max(0,...imp.rows.slice(0,50).map(r=>r.length));for(let i=0;i<ncols;i++){if(mappedIdx.has(i))continue;const name=String(hdr[i]??'').trim()||('Column '+colLetter(i));extraCols.push({i,name});}}
  const items=[];let skipped=0,expanded=0;
  for(const row of rows){
    let feature=get(row,'feature'),hole=get(row,'hole'),box=get(row,'box'),of=get(row,'of');
    if(imp.split&&hole.includes('-')){const k=hole.indexOf('-');const f=hole.slice(0,k).trim(),h=hole.slice(k+1).trim();if(!feature||feature===f){feature=f;hole=h;}}
    const bm=box.match(/^(\d+)\s*(?:\/|of)\s*(\d+)$/i);if(bm){box=bm[1];if(!of)of=bm[2];}
    if(!feature&&!hole){skipped++;continue;}
    const custom={};p.customCols.forEach(c=>{const v=get(row,'c:'+c.id);if(v)custom[c.id]=v;});
    const extras={};extraCols.forEach(e=>{const v=row[e.i]!=null?String(row[e.i]).trim():'';if(v)extras[e.name]=v;});
    let boxes=[box];
    if(/^\d+\s*-\s*\d+(\s*,\s*\d+(\s*-\s*\d+)?)*$/.test(box)){const list=parseRows(box);if(list.length>1&&list.length<=1000){boxes=list.map(String);expanded++;}}
    boxes.forEach(b=>items.push({id:uid(),feature,hole,box:b,of,from:boxes.length>1?'':get(row,'from'),to:boxes.length>1?'':get(row,'to'),custom:Object.assign({},custom),_extras:extras}));
  }
  return{items,extraCols,skipped,expanded};
}
async function readSheetFile(file){
  const name=file.name;const buf=await file.arrayBuffer();
  let imp={fileName:name,mode:'append',skipDup:true,extras:false,headerRow:1,map:{}};
  if(window.XLSX){const wb=XLSX.read(buf,{type:'array'});imp.wb=wb;imp.sheets=wb.SheetNames;imp.sheet=wb.SheetNames[0];imp.rows=sheetRows(wb,imp.sheet);}
  else if(/\.(csv|txt|tsv)$/i.test(name)){imp.rows=parseCSV(new TextDecoder().decode(buf));}
  else{toast('The Excel reader isn’t available offline. Save the sheet as CSV and try again.');return;}
  imp.headerRow=detectHeader(imp.rows);S.imp=imp;autoMap(cur(),imp);render();
}
function sheetRows(wb,name){return XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''});}
function parseCSV(text){
  const delim=(text.split('\n')[0].match(/\t/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?'\t':',';

  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;}

/* ---------- export ---------- */
function planRowsAll(p,P){
  const head=['Bay','Slot','Feature','Hole ID','Box','Of','From (m)','To (m)',...p.customCols.map(c=>c.name),'Status'];
  const rows=[];
  P.racks.forEach(R=>R.cells.forEach(c=>{const it=c.item;
    rows.push([R.rack.name,c.slot,it?it.feature:'',it?it.hole:'',it?numOr(it.box):'',it?numOr(it.of):'',it?numOr(it.from):'',it?numOr(it.to):'',...p.customCols.map(col=>it?((it.custom||{})[col.id]||''):''),c.blocked?'Blocked':c.gap?'Spare':it?'':'Empty']);}));
  P.unplaced.forEach(it=>rows.push(['(no space)','',it.feature,it.hole,numOr(it.box),numOr(it.of),numOr(it.from),numOr(it.to),...p.customCols.map(col=>(it.custom||{})[col.id]||''),'Does not fit']));
  return{head,rows};}
const numOr=v=>{if(v===''||v==null)return'';const n=Number(v);return isNaN(n)?v:n;};
const safeName=s=>String(s||'plan').replace(/[\\/:*?"<>|]+/g,'_').trim()||'plan';
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);}
function exportCSV(p){const P=computePlan(p);const{head,rows}=planRowsAll(p,P);
  const csv=[head,...rows].map(r=>r.map(v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\r\n');
  download(safeName(p.name)+' - bay plan.csv',new Blob(['﻿'+csv],{type:'text/csv'}));toast('CSV exported');}
function exportXLSX(p){
  if(!window.XLSX){toast('Excel export needs an internet connection the first time. Exported CSV instead.');return exportCSV(p);}
  const P=computePlan(p),M=computeMoves(p,P);const wb=XLSX.utils.book_new();const{head,rows}=planRowsAll(p,P);
  const used=new Set();const sname=s=>{let n=String(s).replace(/[\[\]:*?\/\\]/g,'_').slice(0,31)||'Sheet';let b=n,k=2;while(used.has(n.toLowerCase())){n=(b.slice(0,28)+'_'+k++);}used.add(n.toLowerCase());return n;};
  const all=XLSX.utils.aoa_to_sheet([[p.name+(p.site?' · '+p.site:'')],[],head,...rows]);all['!cols']=head.map((h,i)=>({wch:i<2?7:Math.max(10,h.length+2)}));
  XLSX.utils.book_append_sheet(wb,all,sname('All bays'));
  const rh=head.slice(1,-1).concat(['Status']);
  P.racks.forEach(R=>{const aoa=[['Bay ID',R.rack.name],[],rh];R.cells.forEach(c=>{const it=c.item;aoa.push([c.slot,it?it.feature:'',it?it.hole:'',it?numOr(it.box):'',it?numOr(it.of):'',it?numOr(it.from):'',it?numOr(it.to):'',...p.customCols.map(col=>it?((it.custom||{})[col.id]||''):''),c.blocked?'Blocked':c.gap?'Spare':it?'':'Empty']);});
    const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=rh.map((h,i)=>({wch:i===0?6:Math.max(10,h.length+2)}));XLSX.utils.book_append_sheet(wb,ws,sname('Bay '+R.rack.name));});
  if(M&&M.steps.length){const aoa=[['Step','Action','Feature','Hole ID','Box','Of','From','To']];M.steps.forEach((s,i)=>{const it=s.item||{};aoa.push([i+1,{move:'Move',new:'Place new',stage:'To staging',unstage:'From staging',remove:'Remove'}[s.kind],it.feature||'',it.hole||'',numOr(it.box),numOr(it.of),loc(s.from),s.to?loc(s.to):'Out of plan']);});
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(aoa),sname('Moves'));}
  XLSX.writeFile(wb,safeName(p.name)+' - bay plan.xlsx');toast('Excel file exported');}
function saveFile(p){download(safeName(p.name)+'.coreplan.json',new Blob([JSON.stringify({app:'core-rack-planner',version:1,project:p},null,2)],{type:'application/json'}));toast('Project file saved');}


/* ---------- actions ---------- */
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},3200);}
function openCtx(pid,mid){if(!S.ctx||S.ctx.pid!==pid){S.filter={q:'',conds:[],onlyMatches:true};S.filterOpen=false;}S.ctx={pid,mid:mid||null};S.view='work';S.tab='plan';S.q='';S.imp=null;S.confirm=null;S.sel=null;S.updated={};S.renaming=null;S.newMoveFor=null;

function saveMoveToProject(pr,m,quiet){pr.plan=clone(m.plan);pr.plan.name=pr.name;pr.plan.stage='done';deriveNames(pr.plan);const now=Date.now();m.savedAt=now;m.updated=Math.min(m.updated,now);pr.updated=now;persist();if(!quiet)toast(`Saved “${m.name}” to ${pr.name}`);}

    case 'cond-add':S.filter.conds.push({field:'hole',op:'contains',v:''});S.focusAfter='cf_v_'+(S.filter.conds.length-1);render();break;
    case 'cond-del':S.filter.conds.splice(+b.dataset.i,1);render();break;
    case 'filter-clear':S.filter={q:'',conds:[],onlyMatches:S.filter.onlyMatches};render();break;
    case 'filter-apply':{const f=(projRec().filters||[]).find(x=>x.id===id);if(f){S.filter.conds=clone(f.conds);render();toast(`Filter “${f.name}” applied`);}break;}
    case 'filter-del':{const pr=projRec();pr.filters=(pr.filters||[]).filter(x=>x.id!==id);persist();render();break;}
    case 'reorg-yes':{const pr=projRec();reoptimise(pr.plan);pr.updated=Date.now();persist();S.confirm=null;render();toast('Shed reorganised into the best order');break;}
  }
  if(!editable)return;
  switch(act){
    case 'rack-add':{const before=p.racks.length;setBayCount(p,before+1);touch(p);render();toast(`Added bay ${p.racks[p.racks.length-1].name}`);break;}
    case 'rack-del':if(p.racks.length>1){const before=nameSnapshot(p);p.racks=p.racks.filter(r=>r.id!==id);markUpdated(p,before);p.setup.rackCount=p.racks.length;touch(p);render();}break;
    case 'rebuild-rows':{const R=clamp(int($('#st_rowsct').value,1),1,50);const b2b=$('#st_b2b').checked;p.setup.rowCount=R;p.setup.backToBack=b2b;autoLayout(p.racks,R,b2b);S.updated={};deriveNames(p);touch(p);render();toast(`Shed map rebuilt with ${plural(p._rows.length,'row')}`);break;}
    case 'item-del':p.items=p.items.filter(it=>it.id!==id);touch(p);render();break;
    case 'clear':S.confirm='clear';render();break;
    case 'clear-yes':p.items=[];S.confirm=null;touch(p);render();toast('All boxes removed');break;

    case 'feat-reset':p.options.featureOrder=[];p.options.useCustomOrder=false;touch(p);render();break;
    case 'col-del':S.confirm='col:'+id;render();break;
    case 'col-del-yes':p.customCols=p.customCols.filter(c=>c.id!==id);p.items.forEach(it=>{if(it.custom)delete it.custom[id];});S.confirm=null;touch(p);render();break;
    case 'skip-holes':p.stage='done';S.imp=null;S.tab='edit';S.open={racks:true};if(!p.racks.length){p.setup.defaultRows=p.setup.defaultRows||'12';setBayCount(p,4);}finishFirstMove();touch(p);render();window.scrollTo(0,0);break;
    case 'to-racks':p.stage='racks';S.imp=null;if(p.setup.autoCount===undefined)p.setup.autoCount=true;syncWizardRacks(p);touch(p);S.focusAfter='wz_rows';render();window.scrollTo(0,0);break;

    case 'build-racks':syncWizardRacks(p);if(!p.racks.length)return;p.stage='done';S.tab='plan';touch(p);const first=finishFirstMove();render();window.scrollTo(0,0);toast(first?'Rack plan built and saved as the project’s starting layout':'Rack plan built');break;
    case 'fit-racks':{const before=p.racks.length;fitRacks(p);touch(p);render();toast(p.racks.length===before?`${plural(before,'bay')} already fits every box`:`Now ${plural(p.racks.length,'bay')} (was ${before})`);break;}
    case 'hole-del':{const f=b.dataset.feat,h=b.dataset.hole;p.items=p.items.filter(it=>!((it.feature||'')===f&&(it.hole||'')===h));touch(p);render();break;}
    case 'lock-rack':{const r=p.racks.find(x=>x.id===id);if(r){const was=r.locked;lockBays(p,[id],!was);touch(p);render();toast(was?`Bay ${r.name} unlocked. Its boxes stay put until you update to best positions.`:`Bay ${r.name} locked`);}break;}
    case 'lock-row':{const g=groupOfBay(p,id);if(g){const all=g.bays.every(x=>x.locked);lockBays(p,g.bays.map(x=>x.id),!all);touch(p);render();toast(all?`Row ${g.letter} unlocked. Its boxes stay put until you update to best positions.`:`Row ${g.letter} locked`);}break;}
    case 'lock-slot':{const r=p.racks.find(x=>x.id===id);const sl=+b.dataset.slot;const on=lockSlot(p,id,sl);touch(p);render();toast(on?`Slot ${r.name}-${sl} locked`:`Slot ${r.name}-${sl} unlocked. Its box stays put until you update to best positions.`);break;}
    case 'reoptimise':{const n=heldCount(p);reoptimise(p);touch(p);render();toast(`${plural(n,'held box','held boxes')} moved into the best order`);break;}
    case 'row-add-rack':{const g=groupOfBay(p,id);if(g){const r=makeRack(p);appendBayToRow(p,r,g);p.racks.push(r);deriveNames(p);p.setup.rackCount=p.racks.length;touch(p);render();}break;}
    case 'row-del-rack':{const g=groupOfBay(p,id);if(g&&p.racks.length>1){const last=g.bays[g.bays.length-1];p.racks=p.racks.filter(r=>r.id!==last.id);deriveNames(p);if(!groupOfBay(p,S.sel&&S.sel.id))S.sel=null;p.setup.rackCount=p.racks.length;touch(p);render();}break;}
    case 'map-add-row':{const gs=p._rows||deriveNames(p);const last=gs[gs.length-1];const n=last?last.bays.length:4;const cols=last?new Set(last.bays.map(b=>b.x)).size:1;
      const x=last?Math.max(...gs.map(g=>g.maxX))+AISLE:2;const list=[];for(let i=0;i<n;i++){const r=makeRack(p);list.push(r);}
      const len=Math.ceil(n/cols);list.forEach((r,k)=>{const col=cols===2&&k>=len?1:0;r.x=x+col*RW;r.y=2+(col?k-len:k)*RL;});p.racks.push(...list);deriveNames(p);

function finishFirstMove(){const pr=projRec(),m=moveRec();if(pr&&m&&!pr.plan&&m.plan.stage==='done'){saveMoveToProject(pr,m,true);return true;}return false;}

document.addEventListener('submit',e=>{

    else{const pr=S.projects.find(x=>x.id===f.dataset.pid);const m=pr&&pr.moves.find(x=>x.id===f.dataset.id);if(m)m.name=$('#rn_name').value.trim()||m.name;}

    if($('#ab_feat')){$('#ab_feat').value=feat;$('#ab_hole').value=hole;$('#ab_of').value=of;const nx=S.addMode==='single'?$('#ab_box'):$('#ab_hole');nx.focus();nx.select();updateAbHint();}}
  else if(f.id==='filterSaveForm'){const pr=projRec();const name=$('#fs_name').value.trim();if(!name){$('#fs_name').focus();return;}pr.filters=(pr.filters||[]).concat({id:uid(),name,conds:clone(activeConds())});persist();render();toast(`Saved filter “${name}”`);}
  else if(f.id==='colForm'){const p=cur();const n=$('#cc_new').value.trim();if(!n)return;p.customCols.push({id:uid(),name:n});touch(p);render();toast('Column added');}
});

document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fileProject'){const file=t.files[0];if(file)file.text().then(txt=>{try{const d=JSON.parse(txt);const rec=migrateRecord(d.projectRecord||d.project||d);if(!rec)throw 0;
    if(S.projects.some(x=>x.id===rec.id))rec.id=uid();rec.updated=Date.now();S.projects.push(rec);persist();S.view='home';S.ctx=null;render();toast(`Opened ${rec.name}`);}catch(err){toast('That file isn’t a Core Rack Planner project.');}});return;}
  if(t.id==='fileSheet'){const file=t.files[0];if(file)readSheetFile(file).catch(()=>toast('Couldn’t read that file. Try saving it as .xlsx or .csv.'));return;}
  if(t.name==='abmode'){S.addMode=t.value;const form=$('#addForm');form.querySelectorAll('[data-mode]').forEach(el=>el.hidden=el.dataset.mode!==S.addMode);$('#ab_submit').textContent=S.addMode==='range'?'Add boxes':'Add box';updateAbHint();return;}
  const k=t.dataset.k;if(!k)return;const p=cur();const f=t.dataset.f;
  const val=t.type==='checkbox'?t.checked:t.value;
  if(k==='ui'){if(f==='zoom'){S.zoom=int(val,26);render();}if(f==='onlyMatches'){S.filter.onlyMatches=val;render();}return;}
  if(k==='cond'){const c=S.filter.conds[+t.dataset.i];if(!c)return;if(f==='v'||f==='w')return;c[f]=val;
    if(f==='field'){const ty=(filterFields(p).find(x=>x[0]===val)||[0,0,'t'])[2];c.op=FOPS[ty][0][0];c.v='';c.w='';}render();return;}
  if(!p||isReadOnly())return;
  if(k==='setup'&&p.stage==='racks'){
    if(f==='rackCount'){p.setup.rackCount=clamp(int(val,1),1,500);p.setup.autoCount=false;}
    else if(f==='rowCount')p.setup.rowCount=clamp(int(val,1),1,50);
    else p.setup[f]=val;
    syncWizardRacks(p);touch(p);render();const el=document.getElementById(t.id);if(el)el.focus();return;}
  if(k==='setup'){const s=p.setup;
    if(f==='defaultRows'){s.defaultRows=val;const n=int(val,0);if(n>0)p.racks.forEach(r=>r.rows=n);toast('Slots applied to every bay');}
    else if(f==='defaultBlocked'){s.defaultBlocked=val;const bl=parseRows(val);p.racks.forEach(r=>r.blocked=bl.slice());toast('Blocked slots applied to every bay');}
    else if(f==='rackCount')setBayCount(p,clamp(int(val,1),1,500));
    else{s[f]=val;deriveNames(p);}
    touch(p);render();const el=document.getElementById(t.id);if(el)el.focus();return;}
  if(k==='rack'){const r=p.racks.find(x=>x.id===t.dataset.id);if(!r)return;
    if(f==='locked'){lockBays(p,[r.id],val);touch(p);render();return;}
    if(f==='rows')r.rows=clamp(int(val,0),0,500);else if(f==='blocked'){r.blocked=parseRows(val);t.value=fmtRows(r.blocked);}
    touch(p);S.dirty=true;refreshSummary();return;}
  if(k==='label'){const l=p.map.labels.find(x=>x.id===t.dataset.id);if(l){l.text=val.trim()||l.text;touch(p);render();}return;}
  if(k==='map'){if(f==='title'){p.map.title=val;touch(p);return;}p.map[f]=Math.max(0,int(val,0));touch(p);render();return;}
  if(k==='item'){const it=p.items.find(x=>x.id===t.dataset.id);if(!it)return;if(t.dataset.c){it.custom=it.custom||{};it.custom[t.dataset.c]=t.value.trim();}else it[f]=t.value.trim();touch(p);S.dirty=true;refreshSummary();return;}
  if(k==='col'){const c=p.customCols.find(x=>x.id===t.dataset.id);if(c){c.name=t.value.trim()||c.name;touch(p);S.dirty=true;}return;}
  if(k==='opt'){if(t.type==='checkbox'){p.options[f]=t.checked;if(f==='useCustomOrder'&&t.checked&&!(p.options.featureOrder||[]).length)p.options.featureOrder=featureOrder(Object.assign({},p,{options:Object.assign({},p.options,{useCustomOrder:false})}));}
    else p.options[f]=Math.max(0,Math.min(50,parseInt(t.value,10)||0));touch(p);render();return;}
  if(k==='imp'&&S.imp){const imp=S.imp;
    if(f==='sheet'){imp.sheet=t.value;imp.rows=sheetRows(imp.wb,imp.sheet);imp.headerRow=detectHeader(imp.rows);autoMap(p,imp);}
    else if(f==='headerRow'){imp.headerRow=Math.max(0,parseInt(t.value,10)||0);autoMap(p,imp);}
    else if(f==='map'){imp.map[t.dataset.field]=parseInt(t.value,10);imp.auto[t.dataset.field]=false;}
    else if(f==='letter'){const i=letterToIdx(t.value);if(i===-2){toast('Use a column letter like C, or a number like 3.');return;}imp.map[t.dataset.field]=i;imp.auto[t.dataset.field]=false;}
    else if(f==='mode')imp.mode=t.value;
    else imp[f]=t.checked;
    render();return;}
});

let LIVE=null;
document.addEventListener('input',e=>{const t=e.target;
  if(t.id==='gsearch'){S.filter.q=t.value;clearTimeout(LIVE);LIVE=setTimeout(()=>liveRender('gsearch'),160);return;}
  if(t.dataset&&t.dataset.k==='cond'&&(t.dataset.f==='v'||t.dataset.f==='w')){const c=S.filter.conds[+t.dataset.i];if(c){c[t.dataset.f]=t.value;clearTimeout(LIVE);const id=t.id;LIVE=setTimeout(()=>liveRender(id),220);}return;}if(/^ab_(feat|hole|range|box)$/.test(e.target.id))updateAbHint();if(e.target.id==='coreFilter'){S.q=e.target.value;const p=cur();const tb=$('#coreBody');if(tb)tb.innerHTML=coreRows(p,computePlan(p));}});
document.addEventListener('focusout',e=>{
  if(!S.dirty)return;const box=e.target.closest&&e.target.closest('[data-live]');if(!box)return;
  if(e.relatedTarget&&box.contains(e.relatedTarget))return;
  setTimeout(()=>{if(!S.dirty)return;const a=document.activeElement;if(a&&a.closest&&a.closest('[data-live]'))return;const y=window.scrollY;render();window.scrollTo(0,y);},0);
});
document.addEventListener('toggle',e=>{const t=e.target;if(t.id==='manualDetails')S.manualOpen=t.open;if(t.dataset&&t.dataset.sec)S.open[t.dataset.sec]=t.open;if(t.dataset&&t.dataset.pid)S.homeOpen[t.dataset.pid]=t.open;},true);

/* shed map dragging */
let MD=null;
document.addEventListener('pointerdown',e=>{
  const svg=e.target.closest&&e.target.closest('#shedmap');if(!svg||e.button>0)return;
  const rk=e.target.closest('[data-rack]'),rh=e.target.closest('[data-rowh]'),lb=e.target.closest('[data-label]');
  let type,id,el;
  if(rk){type='rack';id=rk.dataset.rack;el=rk;}else if(rh){type='row';id=rh.dataset.rowh;el=svg.querySelector(`[data-rowg="${id}"]`);}else if(lb){type='label';id=lb.dataset.label;el=lb;}
  else{if(S.sel){S.sel=null;render();}return;}
  e.preventDefault();MD={type,id,el,svg,sx:e.clientX,sy:e.clientY,moved:false,target:null,pid:e.pointerId,ro:isReadOnly()};
  if(!MD.ro)try{svg.setPointerCapture(e.pointerId);}catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!MD||e.pointerId!==MD.pid||MD.ro)return;const dx=e.clientX-MD.sx,dy=e.clientY-MD.sy;
  if(!MD.moved){if(Math.hypot(dx,dy)<5)return;MD.moved=true;MD.el.classList.add('dragging');MD.el.style.pointerEvents='none';MD.svg.lastElementChild.appendChild(MD.el);}
  const C=S.zoom;const free=MD.type==='rack';
  const tx=free?dx:Math.round(dx/C)*C,ty=free?dy:Math.round(dy/C)*C;
  MD.el.setAttribute('transform',`translate(${tx} ${ty})`);
  if(MD.type==='rack'){const t=document.elementFromPoint(e.clientX,e.clientY);const tg=t&&t.closest&&t.closest('#shedmap [data-rack]');
    MD.svg.querySelectorAll('.droptarget').forEach(x=>x.classList.remove('droptarget'));
    MD.target=tg&&tg.dataset.rack!==MD.id?tg.dataset.rack:null;if(MD.target)tg.classList.add('droptarget');}
});
function endDrag(e,cancel){
  if(!MD||(e&&e.pointerId!==MD.pid))return;const d=MD;MD=null;const p=cur();
  if(!d.moved||d.ro){if(!cancel){S.sel={type:d.type,id:d.type==='row'?d.id:d.id};render();}return;}
  if(cancel){render();return;}
  const C=S.zoom,fdx=(e.clientX-d.sx)/C,fdy=(e.clientY-d.sy)/C;const before=nameSnapshot(p);let msg='';
  if(d.type==='rack'){const bay=p.racks.find(r=>r.id===d.id);
    if(d.target){swapRacks(p,d.id,d.target);msg='swap';}
    else if(bay){const spot=magnet(p,bay,bay.x+fdx,bay.y+fdy);const ox=bay.x,oy=bay.y;bay.x=Math.max(0,spot.x);bay.y=Math.max(1,spot.y);
      if(p.racks.some(o=>o.id!==bay.id&&overlap(o,bay))){bay.x=ox;bay.y=oy;msg='overlap';}else msg='moved';}
    S.sel={type:'rack',id:d.id};}
  else if(d.type==='row'){const g=groupOfBay(p,d.id);if(g){const dx=Math.round(fdx),dy=Math.round(fdy);const ids=new Set(g.bays.map(b=>b.id));
      const ok=g.bays.every(b=>b.x+dx>=0&&b.y+dy>=1&&!p.racks.some(o=>!ids.has(o.id)&&overlap(o,{x:b.x+dx,y:b.y+dy})));
      if(ok)g.bays.forEach(b=>{b.x+=dx;b.y+=dy;});else msg='overlap';}S.sel={type:'row',id:d.id};}
  else if(d.type==='label'){const l=p.map.labels.find(x=>x.id===d.id);if(l){l.x=Math.max(0,l.x+Math.round(fdx));l.y=Math.max(0,l.y+Math.round(fdy));}S.sel={type:'label',id:d.id};}
  markUpdated(p,before);touch(p);render();
  const r=d.type==='rack'&&p.racks.find(x=>x.id===d.id);
  if(msg==='overlap')toast('That spot overlaps another bay. Drop it on top of a bay to swap, or next to one to join it.');
  else if(r&&before.get(r.id)!==r.name)toast(`This bay is now ${r.name}; the rack plan has been updated.`);
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* drop a spreadsheet */
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('#dropzone');if(!z||!e.dataTransfer||![...(e.dataTransfer.types||[])].includes('Files'))return;e.preventDefault();z.classList.add('over');}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dropzone');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dropzone');if(!z)return;e.preventDefault();z.classList.remove('over');const file=e.dataTransfer.files&&e.dataTransfer.files[0];if(file)readSheetFile(file).catch(()=>toast('Couldn’t read that file. Try saving it as .xlsx or .csv.'));});
/* drag to reorder features */
document.addEventListener('dragstart',e=>{const li=e.target.closest&&e.target.closest('#featlist li');if(!li)return;S.drag=li.dataset.feat;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',S.drag);}catch(_){}});
document.addEventListener('dragover',e=>{const li=e.target.closest&&e.target.closest('#featlist li');if(!li||S.drag==null)return;e.preventDefault();document.querySelectorAll('#featlist li.dragover').forEach(x=>x.classList.remove('dragover'));li.classList.add('dragover');});
document.addEventListener('drop',e=>{const li=e.target.closest&&e.target.closest('#featlist li');if(!li||S.drag==null)return;e.preventDefault();const p=cur();const order=featureOrder(p);
  const from=order.indexOf(S.drag),to=order.indexOf(li.dataset.feat);if(from>=0&&to>=0&&from!==to){const [x]=order.splice(from,1);order.splice(to,0,x);p.options.featureOrder=order;touch(p);}S.drag=null;render();});
document.addEventListener('dragend',()=>{S.drag=null;document.querySelectorAll('#featlist li.dragover').forEach(x=>x.classList.remove('dragover'));});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render();return;}
  if(e.key==='Escape'&&e.target.id==='gsearch'&&S.filter.q){e.preventDefault();S.filter.q='';liveRender('gsearch');}
  if(e.key==='Enter'&&e.target.id==='gsearch'){e.preventDefault();clearTimeout(LIVE);liveRender('gsearch');}});

function runImport(p){
  const imp=S.imp;const data=dataRows(imp);
  if(!(imp.map.hole>=0)){toast('Match Hole ID to a column first.');return;}
  const{items,extraCols}=buildImport(p,imp,data);
  if(imp.mode==='replace')p.items=[];
  const colIds={};extraCols.forEach(e=>{let c=p.customCols.find(x=>x.name.toLowerCase()===e.name.toLowerCase());if(!c){c={id:uid(),name:e.name};p.customCols.push(c);}colIds[e.name]=c.id;});
  const key=it=>[(it.feature||'').toLowerCase(),(it.hole||'').toLowerCase(),String(it.box||'').toLowerCase()].join('|');
  const have=new Set(p.items.map(key));let added=0,skipped=0;
  items.forEach(it=>{Object.entries(it._extras).forEach(([n,v])=>{it.custom[colIds[n]]=v;});delete it._extras;
    if(imp.skipDup&&it.box!==''&&have.has(key(it))){skipped++;return;}have.add(key(it));p.items.push(it);added++;});
  S.imp=null;
  if(p.stage==='holes'&&added){p.stage='racks';if(p.setup.autoCount===undefined)p.setup.autoCount=true;syncWizardRacks(p);window.scrollTo(0,0);S.focusAfter='wz_rows';}
  touch(p);render();toast(`Imported ${added} box${added===1?'':'es'}${skipped?`, skipped ${skipped} already in the plan`:''}`);
}


load();render();
})();
</script>
