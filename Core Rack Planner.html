<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head><body>
<title>Core Rack Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim app bar + tabbed workspace. Brand: Sunwater cyan (from the logo) on deep navy, Manrope throughout. */
:root{
  --bg:#f3f6f7; --surface:#ffffff; --surface-2:#f6f9fa; --ink:#0f2433; --muted:#5a6b76; --line:#dbe3e7;
  --brand:#00b0c9; --brand-ink:#062130; --navy:#0a1f2e; --navy-ink:#ffffff;
  --accent:#007f93; --accent-ink:#ffffff; --accent-soft:#dcf2f6;
  --warn:#9a4f08; --warn-soft:#fbecd8; --bad:#b3261e; --bad-soft:#f9dedc; --ok:#2b7549; --ok-soft:#dcefe2;
  --hatch:#c6d0d4; --rackframe:#6f8290; --chipS:58%; --chipL:80%; --chipInk:#0f2433;
  --f-display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a1720; --surface:#10212c; --surface-2:#142a37; --ink:#e4eef2; --muted:#93a8b3; --line:#22394a;
  --brand:#18c3db; --brand-ink:#04161f; --navy:#061520; --navy-ink:#ffffff;
  --accent:#3fc9de; --accent-ink:#04161f; --accent-soft:#123845;
  --warn:#f0a95e; --warn-soft:#3b2b17; --bad:#f28b82; --bad-soft:#43201c; --ok:#80d09e; --ok-soft:#1a3424;
  --hatch:#2c4250; --rackframe:#57707f; --chipS:42%; --chipL:36%; --chipInk:#eef3f2; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0a1720; --surface:#10212c; --surface-2:#142a37; --ink:#e4eef2; --muted:#93a8b3; --line:#22394a;
  --brand:#18c3db; --brand-ink:#04161f; --navy:#061520; --navy-ink:#ffffff;
  --accent:#3fc9de; --accent-ink:#04161f; --accent-soft:#123845;
  --warn:#f0a95e; --warn-soft:#3b2b17; --bad:#f28b82; --bad-soft:#43201c; --ok:#80d09e; --ok-soft:#1a3424;
  --hatch:#2c4250; --rackframe:#57707f; --chipS:42%; --chipL:36%; --chipInk:#eef3f2; color-scheme:dark;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:1.9rem;line-height:1.1}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.label{font-family:var(--f-display);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
a{color:var(--accent)}

.wrap{padding-inline:16px;max-width:1400px;margin:0 auto}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.grow{flex:1 1 auto;min-width:0}

/* buttons & inputs */
button,.btn{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r);padding:7px 12px;cursor:pointer;line-height:1.2;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--muted)}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.danger{color:var(--bad)}
button.danger.solid{background:var(--bad);color:var(--surface);border-color:var(--bad)}
button.icon{padding:4px 8px;font-size:.9rem}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);padding:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field input,.field select{width:100%}
.field .hint{font-size:.78rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;cursor:pointer}

/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:.02em}
.brandmark{width:22px;height:22px;display:grid;grid-template-rows:repeat(4,1fr);gap:2px;padding:2px;border:2px solid var(--rackframe);border-radius:2px}
.brandmark i{display:block;background:var(--accent);border-radius:1px}
.brandmark i:nth-child(2){background:var(--hatch)}
.crumb{display:flex;gap:8px;align-items:center;min-width:0}
.crumb strong{font-family:var(--f-display);font-size:1.15rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.savestate{font-size:.8rem;color:var(--muted)}
.spacer{flex:1}

/* tabs */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}
.tab{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:12px 14px 9px;font-family:var(--f-display);font-size:.95rem;font-weight:700;color:var(--muted);letter-spacing:0}
.tab:hover{color:var(--ink);border-color:transparent;border-bottom-color:var(--line)}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}
.tab .count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-left:4px;font-weight:400}

/* summary strip */
.summary{display:flex;flex-wrap:wrap;gap:6px 22px;padding-block:14px}
.stat{display:flex;flex-direction:column}
.stat b{font-family:var(--f-mono);font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--warn)}
.stat.bad b{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel > header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;align-items:start}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.notice.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.notice strong{color:var(--warn)}
.notice.info strong{color:var(--accent)}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-display);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.mono{font-family:var(--f-mono);font-size:.86rem}
tr.blocked td{background:repeating-linear-gradient(-45deg,transparent 0 6px,color-mix(in srgb,var(--hatch) 45%,transparent) 6px 8px);color:var(--muted)}
tr.gap td{color:var(--muted);font-style:italic}
tr.empty-slot td{color:var(--muted)}
table.edit td{padding:3px 4px}
table.edit input{width:100%;min-width:60px;padding:5px 7px;border-color:transparent;background:transparent}
table.edit input:hover{border-color:var(--line)}
table.edit input:focus{background:var(--surface);border-color:var(--accent)}
table.edit td.w-s input{min-width:56px;width:64px}
table.edit td.w-m input{min-width:90px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border-radius:999px;font-size:.8rem;font-weight:600;background:hsl(var(--h,200) var(--chipS) var(--chipL));color:var(--chipInk);font-family:var(--f-mono)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.75rem;font-weight:600}
.pill.moved{background:var(--warn-soft);color:var(--warn)}
.pill.new{background:var(--ok-soft);color:var(--ok)}
.pill.stage{background:var(--bad-soft);color:var(--bad)}

/* rack elevation */
.shed{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;align-items:stretch}
.rackcol{display:flex;flex-direction:column;align-items:center;gap:6px;flex:0 0 auto;cursor:pointer;background:none;border:0;padding:0;color:inherit}
.rackcol:hover .rack{border-color:var(--accent)}
.rackcol .rname{font-family:var(--f-display);font-weight:700;font-size:1rem}
.rackcol .rmeta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.rack{border:3px solid var(--rackframe);border-top-width:5px;border-radius:2px;padding:3px;display:flex;flex-direction:column;gap:2px;background:var(--surface-2);width:112px}
.rack.small{width:62px;border-width:2px;border-top-width:3px;padding:2px;gap:1px}
.cell{height:18px;border-radius:2px;display:flex;align-items:center;gap:4px;padding:0 4px;font-family:var(--f-mono);font-size:.66rem;line-height:1;overflow:hidden;white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
.rack.small .cell{height:7px;padding:0;border-width:0}
.cell .n{color:var(--muted);width:14px;text-align:right;flex:0 0 auto}
.cell.filled{background:hsl(var(--h) var(--chipS) var(--chipL));border-color:transparent;color:var(--chipInk)}
.cell.filled .n{color:inherit;opacity:.6}
.cell.blocked{background:repeating-linear-gradient(-45deg,var(--surface) 0 3px,var(--hatch) 3px 5px);border-color:var(--hatch)}
.cell.gap{border-style:dashed;border-color:var(--muted);background:transparent}
.cell.moved{box-shadow:inset 3px 0 0 var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.legend .sw{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px;border:1px solid var(--line)}

.rackgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:16px;align-items:start}
.racksec > header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--r) var(--r) 0 0}
.racksec > header h3{font-size:1.25rem}
.racksec .tablewrap{border-radius:0 0 var(--r) var(--r)}

/* home */
.hero{padding-block:36px 8px;display:flex;flex-direction:column;gap:8px}
.hero p{max-width:64ch;color:var(--muted)}
.projlist{display:grid;gap:10px}
.projcard{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.projcard h3{font-size:1.2rem}
.projcard .meta{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:.85rem}
.projcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:600px){.projcard{grid-template-columns:1fr}.projcard .acts{justify-content:flex-start}}

.featlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.featlist li{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.featlist li.dragover{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.featlist .handle{cursor:grab;color:var(--muted);font-size:1rem;user-select:none}
.featlist .pos{font-family:var(--f-mono);color:var(--muted);width:22px;text-align:right}

.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.mapgrid{display:grid;grid-template-columns:minmax(110px,160px) minmax(0,1fr) 70px;gap:8px 10px;align-items:center}
.mapgrid .hdr{font-size:.75rem}

input::placeholder{text-transform:none}
/* wizard */
.wizard{max-width:880px;margin:0 auto;padding-block:28px 48px;display:flex;flex-direction:column;gap:18px}
.wizard .intro{display:flex;flex-direction:column;gap:6px}
.wizard .intro p{color:var(--muted);max-width:62ch}
.stepper{display:flex;gap:8px;align-items:center;font-family:var(--f-display);font-weight:600;font-size:.92rem;color:var(--muted);flex-wrap:wrap}
.stepper .st{display:flex;align-items:center;gap:6px}
.stepper .st b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-family:var(--f-mono);font-size:.72rem;font-weight:500}
.stepper .st.on{color:var(--ink)}
.stepper .st.on b{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stepper .st.done b{border-color:var(--accent);color:var(--accent)}
.stepper .sep{width:18px;height:1px;background:var(--line)}
.dropzone{border:2px dashed var(--line);border-radius:var(--r);padding:40px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--surface-2)}
.dropzone strong{font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft)}
details.manual{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.manual>summary{padding:14px 18px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.manual>summary::-webkit-details-marker{display:none}
details.manual>summary::after{content:"+";font-family:var(--f-mono);font-size:1.2rem;color:var(--muted)}
details.manual[open]>summary::after{content:"−"}
details.manual>.body{padding:0 18px 18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface);align-self:flex-start}
.seg label{padding:7px 14px;cursor:pointer;font-weight:500;position:relative}
.seg label+label{border-left:1px solid var(--line)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.status{font-size:.8rem;font-weight:600;white-space:nowrap}
.status.ok{color:var(--ok)}.status.manual{color:var(--accent)}.status.miss{color:var(--muted);font-weight:500}.status.err{color:var(--bad)}
.matchtable td{vertical-align:middle}
.matchtable select{min-width:190px}
.matchtable input.letter{width:56px;text-transform:uppercase;text-align:center}
.matchtable tr.err td{background:var(--bad-soft)}
.wizfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{padding:8px 12px;border-radius:var(--r);font-size:.88rem;border:1px solid transparent}
.msg.err{background:var(--bad-soft);color:var(--ink);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.msg.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.msg.info{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.calcline{font-size:1rem}
.calcline .mono{font-size:1.05rem}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:50;max-width:calc(100% - 32px);font-size:.9rem;box-shadow:0 6px 24px rgba(0,0,0,.25)}
footer.foot{padding-block:28px;color:var(--muted);font-size:.8rem}
@media (prefers-reduced-motion:no-preference){button,.cell,.tab{transition:border-color .15s,background-color .15s,color .15s}}

/* map, edit sections, locking, projects */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
@media (max-width:920px){.mapwrap{grid-template-columns:1fr}}
.mapcanvas{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface-2);height:78vh;cursor:grab;overscroll-behavior:contain}
.mapcanvas.panning{cursor:grabbing}
.zoombar{display:flex;gap:4px;align-items:center;height:36px}.zoombar #mp_zpct{min-width:44px;text-align:center}
#shedmap{display:block;user-select:none;-webkit-user-select:none}
#shedmap [data-rack],#shedmap [data-rowh],#shedmap [data-label],#shedmap .rstretch{touch-action:none}
#shedmap .rstretch{fill:var(--accent);fill-opacity:0;cursor:ew-resize}
#shedmap .rstretch[data-dir="y"]{cursor:ns-resize}
#shedmap .rstretch:hover,#shedmap .rstretch.active{fill-opacity:.45}
#shedmap [data-rack].droptarget > rect:first-child{stroke:var(--accent);stroke-width:4}
#shedmap .dragging{opacity:.85}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 116px);display:flex;flex-direction:column;gap:12px}
.side ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.toolbar .field{width:120px}
.modal{position:fixed;inset:0;background:rgba(10,15,18,.55);display:grid;place-items:center;z-index:60;padding:16px}
.modal .box{background:var(--surface);color:var(--ink);border-radius:var(--r);padding:18px;width:min(980px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal img{max-width:100%;height:auto;border:1px solid var(--line);background:#fff;align-self:flex-start}
details.sec>summary .cap{font-family:var(--f-body);font-weight:400;font-size:.85rem;color:var(--muted);margin-left:10px}
.lockbtn{font-size:.8rem;padding:4px 10px}
.lockbtn[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.slotlock{font-size:.72rem;padding:2px 7px;color:var(--muted)}
.slotlock[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rack.locked{border-color:var(--ink)}
.cell.pinned{outline:1.5px solid var(--ink);outline-offset:-1.5px}
.rowgroup{display:flex;flex-direction:column;gap:8px;padding-right:16px;border-right:1px dashed var(--line);flex:0 0 auto}
.rowgroup:last-child{border-right:0;padding-right:0}
.printhead,.printnotes{display:none}
.savewarn{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border:2px solid var(--warn);border-radius:14px;background:var(--warn-soft)}
.savewarn h3{margin:0;color:var(--warn)}.savewarn p{margin:0}.savewarn ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:1rem}
.palsec>summary{display:flex;align-items:baseline;gap:12px;cursor:pointer;list-style:none}.palsec>summary::-webkit-details-marker{display:none}.palsec>summary::after{content:'+';margin-left:auto;font-weight:700;color:var(--muted)}.palsec[open]>summary::after{content:'−'}
.palname{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.picker{display:flex;flex-direction:column;gap:12px;padding:16px;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface-2)}
.pickres{display:flex;flex-direction:column;gap:4px;max-height:280px;overflow:auto}.pickrow,.picked li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 10px;border-radius:8px;background:var(--surface)}
.picked{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.isbadge{display:inline-block;margin-left:8px;padding:0 8px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-size:.8rem;font-weight:700}
.isgroup{display:flex;flex-direction:column;gap:6px}.isgroup h3{margin:0}
.isrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;border:1px solid var(--line);border-radius:10px}

(function(){

const EPS=1e-3,near=(a,b)=>Math.abs(a-b)<EPS,r4=v=>Math.round(v*1e4)/1e4;

const LIGHT={bg:'#f6f9fa',grid:'#e1e8eb',frame:'#6f8290',surface:'#ffffff',ink:'#0f2433',muted:'#5a6b76',accent:'#00a3bb',warn:'#9a4f08',lockfill:'#e4e7e4',chipS:'58%',chipL:'74%'};

/* ---------- state ----------
   A project holds the saved shed state (plan). Core moves hold working copies (plan) that are saved back into the project.
   A plan: {name, stage, setup, racks (bays), map, customCols, options, items}. Bays: {id,name,rows (slots),blocked,x,y,locked,fixed,slotLocks,hold}. */
const S={projects:[],seeded:false,view:'home',ctx:null,tab:'plan',q:'',confirm:null,imp:null,dirty:false,drag:null,storageOk:true,
  addMode:'range',manualOpen:false,open:{},sel:null,updated:{},zoom:26,mapScale:1,renaming:null,newMoveFor:null,focusAfter:null,modal:null,homeOpen:{},filter:{q:'',conds:[],onlyMatches:true},filterOpen:false,match:null,pngLegend:true,expPrompt:null,psearch:'',pfilter:'',shedTab:{},prefill:''};

function defaultsPlan(){return{
  stage:'done',setup:{rackCount:0,defaultRows:'',defaultBlocked:'',letter:'A',startNum:1,rowCount:1,backToBack:false,autoCount:true,numbering:'down'},
  racks:[],map:{title:'',w:0,h:0,labels:[]},customCols:[],
  options:{useCustomOrder:false,featureOrder:[],gapAfterHole:0,gapAfterFeature:0,newRackPerFeature:false},items:[]};}
function makeRack(p){return{id:uid(),name:'',rows:int(p.setup.defaultRows,12)||12,blocked:parseRows(p.setup.defaultBlocked),x:0,y:0,locked:false,fixed:{},slotLocks:{},hold:{}};}
function newPlan(name){const p=defaultsPlan();p.name=name;p.stage='holes';return p;}
function newProjectRec(name,site){const now=Date.now();return{id:uid(),name:name||'Untitled project',site:site||'',created:now,updated:now,plan:null,moves:[]};}
function newMoveRec(name,plan){const now=Date.now();return{id:uid(),name:name||'Core move',created:now,updated:now,savedAt:0,plan};}

function examplePlan(name){
  const p=defaultsPlan();p.name=name;
  p.setup.defaultRows='12';p.setup.defaultBlocked='1-2';p.setup.rowCount=2;p.setup.autoCount=false;
  p.racks=Array.from({length:6},()=>makeRack(p));autoLayout(p.racks,2,false);p.setup.rackCount=6;
  p.map.title='Core shed 2';p.map.labels=[{id:uid(),x:2,y:16,text:'Roller door'}];
  const col={id:uid(),name:'Core size'};p.customCols=[col];
  const holes=[['ZXY','DD101',4,'NQ'],['BMA2','DD109',5,'HQ'],['BMA1','DD101',4,'HQ'],['BMA2','DD105',3,'HQ'],['BMA1','DD100',6,'HQ']];
  holes.forEach(([f,h,n,size],hi)=>{let d=0;for(let b=1;b<=n;b++){const len=4.6+((b*7+hi*3)%9)/10;const from=d;d=+(d+len).toFixed(2);
    p.items.push({id:uid(),feature:f,hole:h,box:String(b),of:String(n),from:from.toFixed(2),to:d.toFixed(2),custom:{[col.id]:size}});}});
  deriveNames(p);return p;}
function exampleProject(){
  const pr=newProjectRec('Example project','Core shed 2 (example)');pr.plan=examplePlan(pr.name);
  const mv=newMoveRec('Add BMA1-DD102',clone(pr.plan));mv.plan.name=pr.name+' – '+mv.name;
  const col=mv.plan.customCols[0];for(let b=1;b<=3;b++)mv.plan.items.push({id:uid(),feature:'BMA1',hole:'DD102',box:String(b),of:'3',from:'',to:'',custom:{[col.id]:'HQ'}});
  pr.moves.push(mv);return pr;}

/* ---------- storage & migration ---------- */
/* ---------- shared folder (File System Access API, Edge/Chrome) ----------
   Each project (with its core moves and saved filters) is one JSON file in <shared folder>/projects/.
   The browser's own storage keeps working as before when no folder is connected. */
const FS={status:'off',handle:null,name:'',files:{},mtime:{},written:{},timer:null,saving:false,lastSync:0,localOnly:[],conflicts:{},poll:null};
const fsSupported=()=>typeof window.showDirectoryPicker==='function';
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('core-rack-planner',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbDo(mode,fn){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('kv',mode);const st=tx.objectStore('kv');const rq=fn(st);tx.oncomplete=()=>res(rq&&rq.result);tx.onerror=()=>rej(tx.error);});}
const idbGet=k=>idbDo('readonly',st=>st.get(k)).catch(()=>null);
const idbSet=(k,v)=>idbDo('readwrite',st=>st.put(v,k)).catch(()=>null);
const idbDel=k=>idbDo('readwrite',st=>st.delete(k)).catch(()=>null);
const fileNameFor=pr=>(String((pr.name||'project')+(pr.site?' '+pr.site:'')).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,70)||'project')+'__'+pr.id+'.json';
async function projDir(){return FS.handle.getDirectoryHandle('projects',{create:true});}
async function fsInit(){
  if(!fsSupported()){FS.status='unsupported';return;}
  const h=await idbGet('dir');if(!h)return;FS.handle=h;FS.name=h.name;
  try{const perm=await h.queryPermission({mode:'readwrite'});if(perm==='granted')await fsAfterConnect();else{FS.status='needs-permission';render();}}catch(e){FS.status='needs-permission';render();}
}
async function fsConnect(){
  if(!fsSupported()){toast('Shared folders need Microsoft Edge or Google Chrome.');return;}
  try{const h=await window.showDirectoryPicker({id:'core-rack-planner',mode:'readwrite'});FS.handle=h;FS.name=h.name;await idbSet('dir',h);await fsAfterConnect(true);}
  catch(e){if(e&&e.name!=='AbortError')toast('Couldn’t open that folder. Check you have permission to edit it.');}
}
async function fsReconnect(){try{const p=await FS.handle.requestPermission({mode:'readwrite'});if(p==='granted')await fsAfterConnect();else toast('The browser needs permission to use the shared folder.');}catch(e){toast('Couldn’t reconnect. Try “Change folder”.');}}
async function fsAfterConnect(first){
  const before=S.projects;
  await fsReadAll();
  FS.status='connected';
  const ids=new Set(S.projects.map(p=>p.id));
  FS.localOnly=before.filter(p=>!ids.has(p.id)&&!(p.name||'').startsWith('Example:'));
  if(first&&!S.projects.length&&!FS.localOnly.length){S.projects=[exampleProject()];fsQueue();}
  if(S.ctx&&!projRec()){S.view='home';S.ctx=null;}
  clearInterval(FS.poll);FS.poll=setInterval(()=>fsRefresh(false),30000);
  render();if(first)toast(`Connected to “${FS.name}”`);
}
async function fsReadAll(){
  const dir=await projDir();const list=[];FS.files={};FS.mtime={};FS.written={};
  for await(const [name,h] of dir.entries()){if(h.kind!=='file'||!name.endsWith('.json'))continue;
    try{const f=await h.getFile();const txt=await f.text();const d=JSON.parse(txt);const rec=migrateRecord(d.projectRecord||d.project||d);if(!rec)continue;
      list.push(rec);FS.files[rec.id]=name;FS.mtime[rec.id]=f.lastModified;FS.written[rec.id]=JSON.stringify(rec);}catch(e){}}
  S.projects=list;FS.lastSync=Date.now();
}
function fsQueue(){if(FS.status!=='connected')return;clearTimeout(FS.timer);FS.timer=setTimeout(fsFlush,500);}
async function fsFlush(){
  if(FS.status!=='connected'||FS.saving)return;FS.saving=true;updateSaveState();
  try{const dir=await projDir();const ids=new Set(S.projects.map(p=>p.id));
    for(const pr of S.projects){const str=JSON.stringify(pr);if(FS.written[pr.id]===str||FS.conflicts[pr.id])continue;
      const name=fileNameFor(pr);const old=FS.files[pr.id];
      if(old&&FS.mtime[pr.id]){try{const cf=await (await dir.getFileHandle(old)).getFile();if(cf.lastModified>FS.mtime[pr.id]+1){FS.conflicts[pr.id]={theirs:await cf.text()};render();continue;}}catch(e){}}
      const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify({app:'core-rack-planner',version:2,projectRecord:pr},null,1));await w.close();
      FS.mtime[pr.id]=(await fh.getFile()).lastModified;FS.written[pr.id]=str;
      if(old&&old!==name){try{await dir.removeEntry(old);}catch(e){}}FS.files[pr.id]=name;}
    for(const id of Object.keys(FS.files)){if(!ids.has(id)){try{await dir.removeEntry(FS.files[id]);}catch(e){}delete FS.files[id];delete FS.mtime[id];delete FS.written[id];}}
    FS.lastSync=Date.now();
  }catch(e){toast('Couldn’t save to the shared folder. Is the network drive available?');}
  FS.saving=false;updateSaveState();
}
async function fsRefresh(manual){
  if(FS.status!=='connected'||FS.saving)return;
  try{const dir=await projDir();let changed=false;const seen=new Set();
    for await(const [name,h] of dir.entries()){if(h.kind!=='file'||!name.endsWith('.json'))continue;const f=await h.getFile();
      const id=(name.match(/__([a-z0-9]+)\.json$/)||[])[1];if(id)seen.add(id);
      if(id&&FS.mtime[id]&&f.lastModified<=FS.mtime[id]+1)continue;
      const d=JSON.parse(await f.text());const rec=migrateRecord(d.projectRecord||d.project||d);if(!rec)continue;seen.add(rec.id);
      const mine=S.projects.find(p=>p.id===rec.id);
      if(mine&&FS.written[rec.id]!==undefined&&JSON.stringify(mine)!==FS.written[rec.id]){FS.conflicts[rec.id]={theirs:JSON.stringify(rec)};changed=true;continue;}
      if(mine)S.projects[S.projects.indexOf(mine)]=rec;else S.projects.push(rec);
      FS.files[rec.id]=name;FS.mtime[rec.id]=f.lastModified;FS.written[rec.id]=JSON.stringify(rec);changed=true;}
    const gone=S.projects.filter(p=>FS.files[p.id]&&!seen.has(p.id));
    if(gone.length){S.projects=S.projects.filter(p=>!gone.includes(p));gone.forEach(p=>{delete FS.files[p.id];delete FS.written[p.id];});changed=true;}
    FS.lastSync=Date.now();
    if(S.ctx&&!projRec()){S.view='home';S.ctx=null;}
    if(changed&&!document.querySelector('input:focus,select:focus'))render();else updateSaveState();
    if(manual)toast(changed?'Updated from the shared folder':'Already up to date');
  }catch(e){if(manual)toast('Couldn’t read the shared folder.');}
}
function fsResolve(id,which){const c=FS.conflicts[id];if(!c)return;delete FS.conflicts[id];
  if(which==='theirs'){try{const d=JSON.parse(c.theirs);const rec=migrateRecord(d.projectRecord||d.project||d);const i=S.projects.findIndex(p=>p.id===id);if(i>=0)S.projects[i]=rec;FS.written[id]=JSON.stringify(rec);FS.mtime[id]=Date.now();}catch(e){}render();toast('Loaded the latest saved version');}
  else{FS.mtime[id]=Date.now()+1e9;FS.written[id]='';fsFlush().then(()=>{render();toast('Your version was saved');});}}
async function fsDisconnect(){clearInterval(FS.poll);await idbDel('dir');FS.status=fsSupported()?'off':'unsupported';FS.handle=null;FS.files={};FS.written={};FS.mtime={};FS.conflicts={};S.projects=[];S.ctx=null;S.view='home';load();render();toast('Disconnected. Showing projects saved in this browser.');}
function stamp(){const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}`;}
async function backupProject(pr){
  const name=fileNameFor(pr).replace(/__[a-z0-9]+\.json$/,'')+'__backup_'+stamp()+'.json';
  const body=JSON.stringify({app:'core-rack-planner',version:2,backupOf:pr.id,backedUpAt:new Date().toISOString(),projectRecord:pr},null,1);
  if(FS.status==='connected'){
    try{const dir=await FS.handle.getDirectoryHandle('Backups',{create:true});const fh=await dir.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(body);await w.close();
      toast(`Backed up to Backups\\${name}`);}catch(e){toast('Couldn’t write to the Backups folder. Check the shared drive is available.');}
  }else{download(name,new Blob([body],{type:'application/json'}));toast('Backup downloaded. Connect a shared folder to save backups there instead.');}
}
function fsCopyLocal(){const n=FS.localOnly.length;FS.localOnly.forEach(p=>{if(!S.projects.some(x=>x.id===p.id))S.projects.push(p);});FS.localOnly=[];fsQueue();render();toast(`Copied ${plural(n,'project')} into the shared folder`);}
function updateSaveState(){const el=$('#savestate');if(el){el.textContent=saveText();el.classList.toggle('unsaved',draftDirty());}const sb=$('#saveBtn');if(sb){sb.disabled=!draftDirty();sb.textContent=draftDirty()?'Save':'Saved';}}
function storagePanel(){

/* ---------- planning engine ---------- */
function computePlan(p){
  deriveNames(p);

  const rank=new Map(feats.map((f,i)=>[f,i]));
  const hue=new Map(feats.map((f,i)=>[f,Math.round((i*137.508+192)%360)]));
  const sorted=[...p.items].sort((a,b)=>(rank.get(a.feature||'')-rank.get(b.feature||''))||nat(a.hole,b.hole)||(numv(a.box)-numv(b.box))||(numv(a.from)-numv(b.from))||(numv(a.to)-numv(b.to))||nat(a.id,b.id));
  if(Array.isArray(p.manualOrder)&&p.manualOrder.length){/* custom order from dragging in the edit table; new boxes slot in after their automatic neighbour */
    const have=new Set(p.items.map(i=>i.id));const out=p.manualOrder.filter(id=>have.has(id));const inM=new Set(out);let prevId=null;
    sorted.forEach(it=>{if(inM.has(it.id)){prevId=it.id;return;}const k=prevId?out.indexOf(prevId)+1:0;out.splice(k,0,it.id);inM.add(it.id);prevId=it.id;});

  const o=p.options;const byId=new Map(p.items.map(i=>[i.id,i]));
  const racks=p.racks.map(r=>({rack:r,used:0,locked:!!r.locked,cells:Array.from({length:Math.max(0,r.rows|0)},(_,i)=>({slot:i+1,blocked:(r.blocked||[]).includes(i+1),item:null,gap:false,closed:false,pin:''}))}));

  const pin=(R,slot,ids,kind)=>{const c=R.cells[(+slot)-1];if(!c||c.blocked)return false;c.closed=true;c.pin=kind;
    (Array.isArray(ids)?ids:[ids]).forEach(id=>{const it=byId.get(id);if(!it||pinned.has(id))return;
      if(c.item){(c.extra=c.extra||[]).push(it);R.used++;pos[it.id]={rackId:R.rack.id,rackName:R.rack.name,slot:c.slot,key:R.rack.id+'|'+c.slot};}else place(R,c,it);
      pinned.add(id);if(kind==='held')held++;});return true;};

    Object.entries(r.slotLocks||{}).forEach(([s,id])=>pin(R,s,id,'slot'));

      else if(nf)skip(Math.max(+o.gapAfterFeature||0,+o.gapAfterHole||0));
      else if(nh)skip(+o.gapAfterHole||0);}
    prev=it;
    const c=next();if(!c){unplaced.push(it);continue;}

}

/* moves = differences between this core move and the saved project */
function computeMoves(p,P){
  if(!S.ctx||!S.ctx.mid)return null;const pr=projRec();if(!pr||!pr.plan)return null;
  const BP=computePlan(pr.plan);const base=BP.pos;const baseItems=new Map(pr.plan.items.map(i=>[i.id,i]));
  const nm=new Map(p.racks.map(r=>[r.id,r.name]));const fix=b=>b?Object.assign({},b,{rackName:nm.get(b.rackId)||b.rackName}):b;
  const ids=new Set(p.items.map(i=>i.id));
  const removed=Object.entries(base).filter(([id])=>!ids.has(id)).map(([id,b])=>({kind:'remove',item:baseItems.get(id)||{},from:fix(b),to:null}));
  const pending=[];const noSpace=[];const basePos={};
  for(const it of P.sorted){const c=P.pos[it.id],b=fix(base[it.id]);if(b)basePos[it.id]=b;
    if(!c){noSpace.push(it);continue;}
    if(!b)pending.push({kind:'new',item:it,from:null,to:c});
    else if(b.key!==c.key)pending.push({kind:'move',item:it,from:b,to:c});}
  const occ=new Map();
  for(const [id,b] of Object.entries(base))if(ids.has(id))occ.set(b.key,id);
  const steps=[...removed];removed.forEach(m=>{});const work=pending.slice();let guard=0;
  while(work.length&&guard++<10000){

    for(let i=0;i<work.length;i++){const m=work[i];const o=occ.get(m.to.key);
      if(o===undefined||o===m.item.id){if(m.from&&m.from.key&&occ.get(m.from.key)===m.item.id)occ.delete(m.from.key);occ.set(m.to.key,m.item.id);steps.push(m);work.splice(i,1);i--;progressed=true;}}
    if(!progressed){const m=work[0];steps.push({kind:'stage',item:m.item,from:m.from,to:{label:'Staging area',key:'__stage_'+m.item.id}});
      if(m.from&&m.from.key)occ.delete(m.from.key);m.from={label:'Staging area',key:'__stage_'+m.item.id};m.kind='unstage';}

  if(FS.status==='connected'&&FS.localOnly.length)h+=`<div class="msg info row" style="align-items:center;justify-content:space-between"><span>${plural(FS.localOnly.length,'project is','projects are')} only saved in this browser: ${FS.localOnly.map(p=>esc(p.name)).join(', ')}.</span><div class="row"><button class="primary" data-act="fs-copy-local">Copy into shared folder</button><button class="ghost" data-act="fs-dismiss-local">Not now</button></div></div>`;
  return h;}

==" alt="Sunwater"><span class="divider" aria-hidden="true"></span><span class="appname">Core Inventory System</span><span class="spacer"></span><span id="savestate" class="savestate small">${esc(saveText())}</span>${folderMenu()}</div>

function groupCard(g,terms){
  let act=g.sheds.find(x=>x.id===S.shedTab[g.key]);
  if(!act&&terms.length)act=g.sheds.find(x=>terms.some(t=>shedText(x).includes(t)));
  if(!act)act=[...g.sheds].sort((a,b)=>b.updated-a.updated)[0];
  return `<article class="projbox">
    <div class="projhead"><div class="stack" style="gap:2px;min-width:0"><h3>${esc(g.name)}</h3><div class="meta small muted row" style="gap:4px 16px"><span>${plural(g.sheds.length,'shed')}</span><span>${plural(g.moves,'core move')}</span><span>Updated ${esc(fmtDate(g.updated))}</span></div></div></div>
    <div class="shedtabs" role="tablist" aria-label="Sheds in ${esc(g.name)}">${g.sheds.map((x,i)=>`<button role="tab" class="shedtab" aria-selected="${x===act}" data-act="shed-tab" data-key="${esc(g.key)}" data-id="${x.id}">${esc(shedName(x,i))}${x.plan?'':' <span class="pill draft">setting up</span>'}</button>`).join('')}<button class="shedtab add" data-act="add-shed" data-key="${esc(g.key)}">+ Add shed</button></div>
    ${shedPanel(act,g.sheds.indexOf(act))}
  </article>`;
}
function shedPanel(pr,idx){
  const ready=!!pr.plan;
  const moves=[...pr.moves].sort((a,b)=>b.updated-a.updated);const open=S.homeOpen[pr.id]===true;
  return `<div class="stack" style="gap:12px">
    <div class="projhead">
      <div class="stack" style="gap:4px;min-width:0">
        ${S.renaming==='p:'+pr.id?`<form id="renameForm" class="row" data-kind="p" data-id="${pr.id}" style="align-items:flex-end"><div class="field"><label class="label" for="rn_name">Project name (all sheds)</label><input id="rn_name" value="${esc(pr.name)}" style="min-width:min(260px,100%)"></div><div class="field"><label class="label" for="rn_site">Shed name</label><input id="rn_site" value="${esc(pr.site)}" placeholder="${esc(shedName(pr,idx))}"></div><button class="primary" type="submit">Save</button><button type="button" data-act="cancel">Cancel</button></form>`:''}
        <div class="meta small muted row" style="gap:4px 16px;align-items:center">${ready?`<span class="mono">${plural(pr.plan.racks.length,'bay')}</span><span class="mono">${plural(pr.plan.items.length,'box','boxes')}</span>`:'<span>Not set up yet: finish the first core move</span>'}<span>Updated ${esc(fmtDate(pr.updated))}</span></div>
      </div>
      <div class="acts row" style="gap:6px;justify-content:flex-end">${S.confirm==='del:'+pr.id?`<span class="small">Delete this shed and its core moves?</span><button class="danger solid" data-act="del-yes" data-id="${pr.id}">Delete</button><button data-act="cancel">Keep</button>`:
        `<button class="primary" data-act="open-project" data-id="${pr.id}" ${ready?'':'disabled'}>Open shed</button><button data-act="new-move" data-id="${pr.id}" ${ready?'':'disabled'}>+ New core move</button><details class="menu"><summary class="btn">Manage</summary><div class="menu-pop" role="menu">
          <button role="menuitem" data-act="rename" data-id="p:${pr.id}">Rename</button>
          <button role="menuitem" data-act="dup" data-id="${pr.id}">Duplicate shed</button>
          <button role="menuitem" data-act="backup" data-id="${pr.id}">Backup <span class="hint">${FS.status==='connected'?'to Backups folder':'download'}</span></button>
          <button role="menuitem" class="danger" data-act="del" data-id="${pr.id}">Delete shed</button></div></details>`}</div>
    </div>
    ${S.newMoveFor===pr.id?`<form id="newMoveForm" class="row" data-id="${pr.id}" style="align-items:flex-end"><div class="field grow"><label class="label" for="nm_name">Core move name</label><input id="nm_name" value="${esc('Core move '+(pr.moves.length+1))}"></div><button class="primary" type="submit">Create move</button><button type="button" data-act="cancel">Cancel</button></form>`:''}
    <details class="movelist" data-pid="${pr.id}" ${open?'open':''}><summary>Core moves <span class="muted mono small">${pr.moves.length}</span></summary>
      <div class="moves">${moves.length?moves.map(m=>`<div class="moverow">
        <div class="stack" style="gap:3px;min-width:0">${S.renaming==='m:'+m.id?`<form id="renameForm" class="row" data-kind="m" data-pid="${pr.id}" data-id="${m.id}" style="align-items:center"><input id="rn_name" value="${esc(m.name)}" aria-label="Move name"><button class="primary" type="submit">Save</button><button type="button" data-act="cancel">Cancel</button></form>`:`<b>${esc(m.name)}</b>`}
          <div class="row small muted" style="gap:4px 12px;align-items:center">${moveStatus(m,pr)}<span>Updated ${esc(fmtDate(m.updated))}</span></div></div>
        <div class="acts">${S.confirm==='save:'+m.id?`<span class="small">Replace the ${esc(shedName(pr,idx))} layout with this move?</span><button class="primary" data-act="save-move-yes" data-pid="${pr.id}" data-id="${m.id}">Save to ${esc(shedName(pr,idx))}</button><button data-act="cancel">Cancel</button>`:
          S.confirm==='delm:'+m.id?`<span class="small">Delete this move?</span><button class="danger solid" data-act="del-move-yes" data-pid="${pr.id}" data-id="${m.id}">Delete</button><button data-act="cancel">Keep</button>`:
          `<button data-act="open-move" data-pid="${pr.id}" data-id="${m.id}">Open</button><button class="primary" data-act="save-move" data-id="${m.id}" ${m.plan.stage==='done'?'':'disabled'}>Save move to ${esc(shedName(pr,idx))}</button><button class="ghost" data-act="rename" data-id="m:${m.id}">Rename</button><button class="ghost danger" data-act="del-move" data-id="${m.id}">Delete</button>`}</div>
      </div>`).join(''):`<p class="muted small">No core moves yet. Use “+ New core move” to plan the next change to this shed.</p>`}</div>
    </details>
  </div>`;
}

/* read-only project */
function projectReadView(pr){
  const p=pr.plan;const P=computePlan(p);const held=P.held;S.match=matchInfo(p,P);
  if(S.tab!=='plan'&&S.tab!=='map')S.tab='plan';
  const tabs=[['plan','Rack plan'],['map','Shed map']];
  return `
  <div class="appbar"><div class="wrap">
    <button class="ghost" data-act="home" aria-label="Back to projects">← Projects</button>
    <div class="crumb grow" style="flex-direction:column;align-items:flex-start;gap:0"><span class="sub">${esc(pr.name)} · saved layout, view only</span><strong title="${esc(pr.site||pr.name)}">${esc(pr.site||pr.name)}</strong></div>
    <span id="savestate" class="savestate">${esc(saveText())}</span>
    <details class="menu" id="exportMenu"><summary class="btn">Export</summary><div class="menu-pop" role="menu">
      <button role="menuitem" data-act="export-xlsx">Excel, inventory template <span class="hint">.xlsx</span></button>
      <button role="menuitem" data-act="export-csv">CSV, inventory template <span class="hint">.csv</span></button>
      <button role="menuitem" data-act="export-xlsx-full">Excel, full planner layout <span class="hint">.xlsx</span></button>
      <button role="menuitem" data-act="save-file">Project file <span class="hint">.json</span></button></div></details>
  </div>
  <div class="wrap tabrow"><nav class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" aria-selected="${S.tab===k}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</nav>${searchBar()}</div>
  </div>
  <main class="wrap ${S.tab==='map'?'wide':''}">
    ${S.tab==='map'?'':`<div id="summary">${summary(p,P)}</div>`}
    <div class="stack">
      ${conflictBanner()}${filterPanel(p)}${searchPanel(p,P)}
      ${S.tab==='map'?'':`<section class="panel readonly-bar">
        <p class="muted" style="max-width:70ch">This is the saved layout of the shed. To change it, plan the change in a core move and save that move to the project.</p>

const FOPS={t:[['contains','contains'],['is','is exactly'],['starts','starts with'],['not','does not contain']],n:[['eq','equals'],['gte','at least'],['lte','at most'],['between','between']]};

function fieldVal(it,field,P){const ps=P.pos[it.id];if(field==='bay')return ps?ps.rackName:'';if(field==='row')return ps?ps.rackName.replace(/\d+$/,''):'';if(field.startsWith('c:'))return (it.custom||{})[field.slice(2)]||'';return it[field]??'';}
function condOk(c,it,P,type){const raw=fieldVal(it,c.field,P);
  if(type==='n'){const x=parseFloat(raw),a=parseFloat(c.v),b=parseFloat(c.w);if(isNaN(x)||isNaN(a))return false;
    if(c.op==='gte')return x>=a;if(c.op==='lte')return x<=a;if(c.op==='between'){const hi=isNaN(b)?a:b;return x>=Math.min(a,hi)&&x<=Math.max(a,hi);}return x===a;}
  const s=String(raw).toLowerCase(),v=String(c.v).trim().toLowerCase();
  if(c.op==='is')return s===v;if(c.op==='starts')return s.startsWith(v);if(c.op==='not')return !s.includes(v);return s.includes(v);}
function matchInfo(p,P){if(!filterActive())return null;
  const terms=S.filter.q.split(',').map(t=>t.trim().toLowerCase()).filter(Boolean);const conds=activeConds();const types=new Map(filterFields(p).map(f=>[f[0],f[2]]));
  const ids=new Set(),byBay=new Map(),list=[];
  const bays=new Set(P.racks.map(R=>String(R.rack.name).toLowerCase())),rowsL=new Set(P.rowList.map(G=>String(G.row.letter).toLowerCase()));
  /* a term that names a real row, bay or slot is a location search; anything else searches feature and hole IDs */
  const locT=terms.map(t=>{const c=t.replace(/\s+/g,'');let m=/^row([a-z]{1,3})$/.exec(c);if(m&&rowsL.has(m[1]))return{row:m[1]};
    m=/^([a-z]{1,3}\d+)(?:-(\d+))?$/.exec(c);if(m&&bays.has(m[1]))return{bay:m[1],slot:m[2]?+m[2]:0};return null;});
  P.sorted.forEach(it=>{
    if(terms.length){const hay=[it.feature,it.hole,(it.feature||'')+'-'+(it.hole||'')].map(x=>String(x||'').toLowerCase());const ps=P.pos[it.id];
      const bay=ps?String(ps.rackName).toLowerCase():'',row=bay.replace(/\d+$/,'');
      if(!terms.some((t,i)=>{const L=locT[i];if(L){if(!ps)return false;if(L.row)return row===L.row;return bay===L.bay&&(!L.slot||ps.slot===L.slot);}return hay.some(h=>h.includes(t));}))return;}

function locText(p,P,it){const ps=P.pos[it.id];if(ps)return ps.rackName+'-'+ps.slot;if(it.temp){const pl0=pallets(p).find(x=>x.id===it.pallet);return pl0?pl0.text:'pallet';}return 'no slot';}

function unpickForMove(p,id){const mm=mmState(p);const o=(mm.orig||{})[id];const it=p.items.find(x=>x.id===id);if(o&&it){

  if(mm.orig)delete mm.orig[id];}
function mmBoxes(p,P,M){const byId=new Map(p.items.map(i=>[i.id,i]));const ex=((p.mm&&p.mm.extra)||[]).map(id=>byId.get(id)).filter(Boolean);
  if(p.pallet&&p.pallet.list&&p.pallet.list.length){const pl=p.pallet.list.map(x=>byId.get(x.id)).filter(Boolean);const inPl=new Set(pl.map(x=>x.id));return{src:'pallet',list:pl.concat(ex.filter(x=>!inPl.has(x.id))),pal:new Map(p.pallet.list.map(x=>[x.id,x.pal||''])),palIds:inPl};}
  if(ex.length)return{src:'pick',list:ex,pal:new Map()};
  if(p.pallet&&p.pallet.list&&p.pallet.list.length)return{src:'pallet',list:p.pallet.list.map(x=>byId.get(x.id)).filter(Boolean),pal:new Map(p.pallet.list.map(x=>[x.id,x.pal||'']))};
  const pr=projRec();if(M&&pr&&pr.plan){const ids=[];M.steps.forEach(s2=>{if(s2.item&&s2.kind!=='remove'&&!ids.includes(s2.item.id))ids.push(s2.item.id);});return{src:'changes',list:ids.map(id=>byId.get(id)).filter(Boolean),pal:new Map()};}
  return{src:'all',list:P.sorted.slice(),pal:new Map()};}
function slotRank(P){const rank=new Map();let k=0;P.rowList.forEach(G=>G.racks.forEach(R=>R.cells.forEach(c=>rank.set(R.rack.id+'|'+c.slot,k++))));return rank;}
function mmOrdered(p,P,B,order){if(order==='pallet'&&B.src==='pallet'){const rank0=slotRank(P);const k0=it=>{const ps=P.pos[it.id];return ps?rank0.get(ps.rackId+'|'+ps.slot):1e9;};return B.list.filter(x=>B.palIds.has(x.id)).reverse().concat(B.list.filter(x=>!B.palIds.has(x.id)).sort((a,b)=>k0(a)-k0(b)));}
  const rank=slotRank(P);const key=it=>{const ps=P.pos[it.id];return ps?rank.get(ps.rackId+'|'+ps.slot):1e9;};return B.list.slice().sort((a,b)=>key(a)-key(b));}

function pinHere(p,id){const P=computePlan(p);const ps=P.pos[id];if(!ps)return false;const r=p.racks.find(x=>x.id===ps.rackId);if(!r)return false;

function exportPNG(p){

function issuesList(p){const ign=new Set(p.ignoredIssues||[]);const out=[];
  const key=it=>[(it.feature||'').trim().toLowerCase(),(it.hole||'').trim().toLowerCase(),String(it.box||'').trim().toLowerCase()].join('|');
  const groups=new Map();p.items.forEach(it=>{if(!String(it.hole||'').trim()||!String(it.box||'').trim())return;const k=key(it);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(it);});
  groups.forEach(list=>{if(list.length<2)return;const k='dup:'+list.map(x=>x.id).sort().join(',');if(!ign.has(k))out.push({type:'dup',key:k,items:list});});

function syncHS(){document.querySelectorAll('.hsbar[data-hsfor]').forEach(bar=>{const w=document.getElementById(bar.dataset.hsfor);if(!w)return;
  const need=w.scrollWidth>w.clientWidth+2;bar.hidden=!need;if(!need)return;const tr=bar.querySelector('.hstrack');tr.querySelector('.hsinner').style.width=(w.scrollWidth/w.clientWidth*tr.clientWidth)+'px';
  tr.scrollLeft=w.scrollLeft/(w.scrollWidth-w.clientWidth||1)*(tr.scrollWidth-tr.clientWidth);});}
let HSLOCK=false;

  if(t.classList.contains('hstrack')){const bar=t.closest('.hsbar'),w=document.getElementById(bar.dataset.hsfor);if(w)w.scrollLeft=t.scrollLeft/(t.scrollWidth-t.clientWidth||1)*(w.scrollWidth-w.clientWidth);}

let DRAG=null;
document.addEventListener('dragstart',e=>{const h=e.target.closest&&e.target.closest('[data-drag]');if(!h)return;DRAG={id:h.dataset.drag};
  try{e.dataTransfer.setData('text/plain',DRAG.id);e.dataTransfer.effectAllowed='move';const tr=h.closest('tr');if(tr)e.dataTransfer.setDragImage(tr,12,12);}catch(_){}
  setTimeout(()=>{const tr=h.closest('tr');if(tr)tr.classList.add('dragsrc');},0);});
const clearDrop=()=>document.querySelectorAll('#coreBody tr.drop-before,#coreBody tr.drop-after,#coreBody tr.dragsrc').forEach(x=>x.classList.remove('drop-before','drop-after','dragsrc'));
document.addEventListener('dragover',e=>{if(!DRAG)return;const tr=e.target.closest&&e.target.closest('#coreBody tr[data-row]');if(!tr)return;e.preventDefault();e.dataTransfer.dropEffect='move';
  const r=tr.getBoundingClientRect();const after=e.clientY>r.top+r.height/2;document.querySelectorAll('#coreBody tr.drop-before,#coreBody tr.drop-after').forEach(x=>{if(x!==tr)x.classList.remove('drop-before','drop-after');});
  tr.classList.toggle('drop-after',after);tr.classList.toggle('drop-before',!after);
  const wrap=document.scrollingElement;if(e.clientY<90)wrap.scrollTop-=14;else if(e.clientY>innerHeight-70)wrap.scrollTop+=14;});
document.addEventListener('drop',e=>{if(!DRAG)return;const tr=e.target.closest&&e.target.closest('#coreBody tr[data-row]');const d=DRAG;DRAG=null;if(!tr){clearDrop();return;}e.preventDefault();
  const after=tr.classList.contains('drop-after');clearDrop();if(tr.dataset.row===d.id)return;reorderItem(cur(),d.id,tr.dataset.row,after);});
document.addEventListener('dragend',()=>{DRAG=null;clearDrop();});
function reorderItem(p,id,targetId,after){const P=computePlan(p);const it=p.items.find(x=>x.id===id);if(!it)return;
  const c=P.racks.flatMap(R=>R.cells).find(c=>c.item&&c.item.id===id||(c.extra||[]).some(x=>x.id===id));
  if(c&&c.pin){toast(c.pin==='held'?'This box is being kept in its slot. Press “Update unlocked bays to best positions” first, then reorder it.':'This box is locked in its slot. Unlock it to move it.');return;}
  const ids=P.sorted.map(x=>x.id).filter(x=>x!==id);let k=ids.indexOf(targetId);if(k<0)return;if(after)k++;ids.splice(k,0,id);
  const was=P.pos[id];p.manualOrder=ids;touch(p);render();const now=computePlan(p).pos[id];
  toast(now?`Box ${it.hole} ${it.box} is now in ${now.rackName}-${now.slot}${was?` (was ${was.rackName}-${was.slot})`:''}.`:'Box moved in the order.');}
function coreRows(p,P){
  const rows=P.sorted.filter(it=>!S.match||S.match.ids.has(it.id));
  if(!rows.length)return `<tr><td colspan="${9+p.customCols.length}" class="muted" style="padding:14px">No boxes match the search and filters.</td></tr>`;
  const inp=(it,f,cls,num)=>`<td class="${cls||''}"><input id="it_${f}_${it.id}" data-k="item" data-id="${it.id}" data-f="${f}" value="${esc(it[f])}" ${num?'inputmode="decimal" style="text-align:right"':''} aria-label="${f}"></td>`;
  return rows.map(it=>{const ps=P.pos[it.id];return `<tr data-row="${it.id}">
    <td class="lead"><span class="draghandle" draggable="true" data-drag="${it.id}" title="Drag to reorder" aria-label="Drag to reorder">⠿</span><button class="icon ghost danger" data-act="item-del" data-id="${it.id}" aria-label="Remove box" title="Remove box">✕</button></td>
    <td class="w-s locin"><input id="it_loc_${it.id}" data-k="itemloc" data-id="${it.id}" value="${ps?esc(ps.rackName+'-'+ps.slot):it.temp?esc((pallets(p).find(x=>x.id===it.pallet)||{}).text||'pallet'):''}" placeholder="No space" title="Type a slot like A1-5 to put this box there" aria-label="Slot for box ${esc(it.hole)} ${esc(it.box)}" class="mono">${it.missing?' <span class="pill missing">missing</span>':''}</td>
    ${inp(it,'feature','w-m')}${inp(it,'hole','w-m')}${inp(it,'box','w-s',1)}${inp(it,'of','w-s',1)}${inp(it,'from','w-s',1)}${inp(it,'to','w-s',1)}
    ${p.customCols.map(c=>`<td class="w-m"><input id="it_c_${c.id}_${it.id}" data-k="item" data-id="${it.id}" data-c="${c.id}" value="${esc((it.custom||{})[c.id])}" aria-label="${esc(c.name)}"></td>`).join('')}
    </tr>`;}).join('');
}

function updateAbHint(){
  const h=$('#ab_hint');if(!h)return;const feat=($('#ab_feat')||{}).value||'',hole=($('#ab_hole')||{}).value||'';

  if(S.addMode==='single'){const b=(($('#ab_box')||{}).value||'').trim();h.textContent=b?`Adds box ${b} to ${id}.`:'Adds one box. Use this for a box that was missed.';return;}
  const raw=(($('#ab_range')||{}).value||'').trim();const boxes=parseRows(raw);

  return `<div class="appbar"><div class="wrap">
    <button class="ghost" data-act="home" aria-label="Back to projects">← Projects</button>
    <div class="crumb grow"><strong title="${esc(p.name)}">${esc(p.name)}</strong></div>
    <div class="stepper">${st(1,'Hole info')}<span class="sep"></span>${st(2,'Bays')}<span class="sep"></span>${st(3,'Rack plan')}</div>
  </div></div>`;
}
function groupHoles(P){const out=[],idx=new Map();P.sorted.forEach(it=>{const k=(it.feature||'')+'\u0000'+(it.hole||'');if(!idx.has(k)){idx.set(k,out.length);out.push({feature:it.feature||'',hole:it.hole||'',items:[]});}out[idx.get(k)].items.push(it);});return out;}

  const ofs=[...new Set(items.map(i=>String(i.of||'').trim()).filter(Boolean))];

function genRacks(p,n){return Array.from({length:n},()=>makeRack(p));}
function rackDims(p){const rows=parseInt(p.setup.defaultRows,10);if(!(rows>0))return{valid:false,rows:0,usable:0};const usable=rows-parseRows(p.setup.defaultBlocked).filter(b=>b<=rows).length;return{valid:usable>0,rows,usable};}
function racksNeeded(p){const d=rackDims(p);const r0=p.racks[0];const rows=d.valid?d.rows:(r0?r0.rows:0);const bl=d.valid?parseRows(p.setup.defaultBlocked):(r0?r0.blocked.slice():[]);
  const usable=rows-bl.filter(b=>b<=rows).length;if(!(usable>0))return 0;if(!p.items.length)return 1;
  for(let n=Math.max(1,Math.ceil(p.items.length/usable));n<=500;n++){const racks=Array.from({length:n},(_,i)=>({id:'t'+i,name:'',rows,blocked:bl,x:2,y:2+i*RL,locked:false,fixed:{},slotLocks:{},hold:{}}));
    const t=Object.assign({},p,{racks});if(!computePlan(t).unplaced.length)return n;}return 500;}
function syncWizardRacks(p){const d=rackDims(p);if(!d.valid){p.racks=[];deriveNames(p);return;}
  const n=p.setup.autoCount!==false?racksNeeded(p):clamp(int(p.setup.rackCount,1),1,500);p.setup.rackCount=n;
  p.racks=genRacks(p,n);const R=clamp(int(p.setup.rowCount,1),1,n);p.setup.rowCount=R;autoLayout(p.racks,R,!!p.setup.backToBack,p.setup.orient,p.setup.numbering==='across');deriveNames(p);}
function setBayCount(p,n){n=clamp(n|0,1,500);deriveNames(p);
  while(p.racks.length<n){const g=rowGroups(p);const b=makeRack(p);appendBayToRow(p,b,g[g.length-1]);p.racks.push(b);deriveNames(p);}
  while(p.racks.length>n){p.racks.pop();deriveNames(p);}
  p.setup.rackCount=p.racks.length;}
function fitRacks(p){

  p.setup.rackCount=p.racks.length;}

/* depth words: Unknown → ?, missing → red label, EMPTY → empty slot */
const isWord=(v,w)=>String(v??'').trim().toLowerCase()===w;
const fixDepth=v=>isWord(v,'unknown')?'?':String(v??'').trim();
function cleanItem(it){let miss=!!it.missing;const orig=Object.assign({},it.missingOrig||{});
  ['from','to','box','of','hole'].forEach(f=>{const v=String(it[f]??'').trim();if(/\bmissing\b/i.test(v)){miss=true;orig[f]=v;it[f]='';}else if(f==='from'||f==='to')it[f]=fixDepth(it[f]);});
  if(miss){it.missing=true;if(Object.keys(orig).length)it.missingOrig=orig;}return it;}
function outVal(it,f){const v=it[f]??'';if(!it.missing||v!=='')return v;const o=it.missingOrig||{};if(o[f]!=null)return o[f];
  if((f==='from'||f==='to')&&!o.from&&!o.to&&!o.hole&&!o.box&&!o.of)return 'MISSING';return v;}
const isEmptyBox=(...vals)=>vals.some(v=>isWord(v,'empty'));
/* import */
const FIELDS=[['feature','Feature ID',['feature','featureid','feat','feature code','structure','area']],
  ['hole','Hole ID',['hole','holeid','hole id','hole_id','holename','holeno','holenumber','borehole','bore','drillhole','boreholeid']],
  ['box','Box',['box','boxno','boxnumber','boxid','tray','trayno','traynumber','box#','core box']],
  ['of','Of',['of','totalboxes','boxes','ofboxes','boxof','noofboxes','numberofboxes','total']],
  ['from','From (m)',['from','fromm','depthfrom','from(m)','fromdepth','start','startdepth','top','depthfromm']],
  ['to','To (m)',['to','tom','depthto','to(m)','todepth','end','enddepth','bottom','depthtom','base','depthbase','basem']]];
const normH=s=>String(s??'').toLowerCase().replace(/[^a-z0-9#]/g,'');
const LAYOUT_FIELDS=[['location','Location (e.g. A1-3)',['location','loc','position','rackposition','racklocation','shedlocation','address','rowbayslot','locationid','coreshedlocation']],
  ['row','Row',['row','rackrow','rowletter','aisle','line']],
  ['bay','Bay',['bay','rack','bayno','baynumber','rackno','racknumber','bay#','rack#']],
  ['slot','Slot',['slot','shelf','level','slotno','slotnumber','shelfno','tier','shelfnumber']]];
const PALLET_FIELDS=[['order','Pallet order (No.)',['no','#','order','stackorder','palletorder','sequence','seq','itemno','stackno','orderno','loadorder']],['pallet','Pallet',['pallet','palletno','palletnumber','palletid']]];
const fieldsFor=imp=>imp&&imp.kind==='layout'?LAYOUT_FIELDS.concat(FIELDS):FIELDS.concat(PALLET_FIELDS);
function parseLoc(R,B,Sl,loc){
  R=String(R||'').trim().toUpperCase();B=String(B||'').trim().toUpperCase();Sl=String(Sl||'').trim();
  if(loc){const m=String(loc).trim().toUpperCase().match(/^([A-Z]+)\s*[-_ ]?\s*(\d+)\s*[-_\/. ]\s*(\d+)$/);if(m){R=R||m[1];B=B||m[2];Sl=Sl||m[3];}}
  const bm=B.match(/^([A-Z]+)\s*-?\s*(\d+)$/);if(bm){R=R||bm[1];B=bm[2];}
  if(/^\d+$/.test(R))R=+R>0?letterAdd('A',+R-1):'';R=R.replace(/[^A-Z]/g,'');
  const b=parseInt(B,10),s=parseInt(Sl,10);if(!R||!(b>=0)||!(s>=1)||s>500)return null;return{row:R,bay:b,slot:s};}
const tidyName=n=>{n=String(n).replace(/\s+/g,' ').trim();n=n.split(' ').map(w=>/[A-Z]{2}/.test(w)&&w===w.toUpperCase()?w.toLowerCase():w).join(' ');return n.charAt(0).toUpperCase()+n.slice(1);};

function buildImport(p,imp,rows){
  const m=imp.map;const get=(row,k)=>{const i=m[k];return i>=0&&row[i]!=null?String(row[i]).trim():'';};
  const hdr=imp.headerRow>0?(imp.rows[imp.headerRow-1]||[]):[];
  const mappedIdx=new Set(Object.values(m).filter(v=>v>=0));
  const extraCols=[];
  if(imp.extras){const ncols=Math.max(0,...imp.rows.slice(0,50).map(r=>r.length));for(let i=0;i<ncols;i++){if(mappedIdx.has(i))continue;const name=String(hdr[i]??'').trim()||('Column '+colLetter(i));extraCols.push({i,name});}}
  const items=[];let skipped=0,expanded=0;
  for(const row of rows){
    let feature=get(row,'feature'),hole=get(row,'hole'),box=get(row,'box'),of=get(row,'of');
    if(imp.split&&hole.includes('-')){const k=hole.indexOf('-');const f=hole.slice(0,k).trim(),h=hole.slice(k+1).trim();if(!feature||feature===f){feature=f;hole=h;}}
    const bm=box.match(/^(\d+)\s*(?:\/|of)\s*(\d+)$/i);if(bm){box=bm[1];if(!of)of=bm[2];}
    if(!feature&&!hole||isEmptyBox(feature,hole,box)){skipped++;continue;}
    const custom={};p.customCols.forEach(c=>{const v=get(row,'c:'+c.id);if(v)custom[c.id]=v;});
    const extras={};extraCols.forEach(e=>{const v=row[e.i]!=null?String(row[e.i]).trim():'';if(v)extras[e.name]=v;});
    let boxes=[box];
    if(/^\d+\s*-\s*\d+(\s*,\s*\d+(\s*-\s*\d+)?)*$/.test(box)){const list=parseRows(box);if(list.length>1&&list.length<=1000){boxes=list.map(String);expanded++;}}
    const ord=get(row,'order'),pal=get(row,'pallet');
    boxes.forEach(b=>items.push(cleanItem({_ord:ord,_pal:pal,_row:items.length,id:uid(),feature,hole,box:b,of,from:boxes.length>1?'':get(row,'from'),to:boxes.length>1?'':get(row,'to'),custom:Object.assign({},custom),_extras:extras})));
  }
  return{items,extraCols,skipped,expanded};
}
async function readSheetFile(file,kind){
  const name=file.name;const buf=await file.arrayBuffer();
  let imp={fileName:name,mode:'append',skipDup:true,extras:kind==='layout',headerRow:1,map:{},kind:kind||'holes',layoutStyle:'single',lockAll:true};
  if(window.XLSX){const wb=XLSX.read(buf,{type:'array'});imp.wb=wb;imp.sheets=wb.SheetNames;imp.sheet=wb.SheetNames[0];imp.rows=sheetRows(wb,imp.sheet);}
  else if(/\.(csv|txt|tsv)$/i.test(name)){imp.rows=parseCSV(new TextDecoder().decode(buf));}
  else{toast('The Excel reader isn’t available offline. Save the sheet as CSV and try again.');return;}
  imp.headerRow=detectHeader(imp.rows);S.imp=imp;autoMap(cur(),imp);
  if(S.palletNext){S.palletNext=false;imp.pallet=true;imp.fromMove=true;S.mmZoom=true;S.mmDir='zoom';if((cur().items||[]).length){imp.mode='pallet';imp.skipDup=true;}S.tab='moves';}
  render();
}
function sheetRows(wb,name){return XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:false,defval:''});}
function parseCSV(text){
  const delim=(text.split('\n')[0].match(/\t/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?'\t':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;else if(c===delim){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=c;}
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;}

function planRowsAll(p,P){
  const head=['Bay','Slot','Feature','Hole ID','Box','Of','From (m)','To (m)',...p.customCols.map(c=>c.name),'Status'];
  const rows=[];
  P.racks.forEach(R=>R.cells.forEach(c=>{(c.item?slotBoxes(c):[null]).forEach(it=>{
    rows.push([R.rack.name,c.slot,it?it.feature:'',it?outVal(it,'hole'):'',it?numOr(outVal(it,'box')):'',it?numOr(outVal(it,'of')):'',it?numOr(outVal(it,'from')):'',it?numOr(outVal(it,'to')):'',...p.customCols.map(col=>it?((it.custom||{})[col.id]||''):''),c.blocked?'Blocked':c.gap?'Spare':it?(it.missing?'Missing':''):'Empty']);});}));
  pallets(p).forEach(pl0=>palletItems(p,pl0.id).forEach(it=>rows.push([pl0.text,'',it.feature,outVal(it,'hole'),numOr(outVal(it,'box')),numOr(outVal(it,'of')),numOr(outVal(it,'from')),numOr(outVal(it,'to')),...p.customCols.map(col=>(it.custom||{})[col.id]||''),pl0.kept?'Stored on pallet':'On temporary pallet'])));
  P.unplaced.forEach(it=>rows.push(['(no space)','',it.feature,outVal(it,'hole'),numOr(outVal(it,'box')),numOr(outVal(it,'of')),numOr(outVal(it,'from')),numOr(outVal(it,'to')),...p.customCols.map(col=>(it.custom||{})[col.id]||''),'Does not fit']));
  return{head,rows};}

      if(key==='box')return it?outVal(it,'box'):'';if(key==='of')return it?outVal(it,'of'):'';

    const sv=MD.mc.querySelector('#shedmap');const old=sv&&sv.querySelector('.drawprev');if(old)old.remove();if(sv)sv.insertAdjacentHTML('beforeend',MD.prev);return;}
  if(!MD.moved){if(Math.hypot(dx,dy)<5)return;MD.moved=true;MD.el.classList.add('dragging');MD.el.style.pointerEvents='none';MD.svg.lastElementChild.appendChild(MD.el);}
  const free=MD.type==='rack'||(MD.type==='label'&&S.mapSnap===false);
  const tx=free?dx/sc:Math.round(dx/sc/C)*C,ty=free?dy/sc:Math.round(dy/sc/C)*C;
  MD.el.setAttribute('transform',`translate(${tx} ${ty})`);
  if(MD.type==='rack'){const t=document.elementFromPoint(e.clientX,e.clientY);const tg=t&&t.closest&&t.closest('#shedmap [data-rack]');
    MD.svg.querySelectorAll('.droptarget').forEach(x=>x.classList.remove('droptarget'));
    MD.target=tg&&tg.dataset.rack!==MD.id?tg.dataset.rack:null;if(MD.target)tg.classList.add('droptarget');}
});
function restoreStretch(d){(d.names||[]).forEach(([b,l,n])=>{if(l)b.letterFix=l;else delete b.letterFix;if(n)b.numMode=n;else delete b.numMode;});d.orig.forEach(o=>{const b=o.b;b.x=o.x;b.y=o.y;if(o.sw)b.sw=o.sw;else delete b.sw;if(o.sh)b.sh=o.sh;else delete b.sh;});}
function endDrag(e,cancel){
  if(!MD||(e&&e.pointerId!==MD.pid))return;const d=MD;MD=null;const p=cur();
  if(d.type==='pan'){d.mc.classList.remove('panning');if(!d.moved&&!cancel&&S.sel){S.sel=null;S.selEdit=null;render();}return;}
  if(d.type==='stretch'){if(d.raf)cancelAnimationFrame(d.raf);const g0=groupOfBay(p,d.id);
    if(!d.moved||cancel){restoreStretch(d);render();return;}
    const clash=d.orig.some(o=>p.racks.some(x=>!d.ids.has(x.id)&&(overlap(x,o.b)||touching(x,o.b))));
    if(!clash)(d.names||[]).forEach(([b,l,n])=>{if(l)b.letterFix=l;else delete b.letterFix;if(n)b.numMode=n;else delete b.numMode;});
    if(clash){restoreStretch(d);render();toast('That would run into another row. Move the row to open space first, or stretch it less.');return;}
    S.mapUndo=(S.mapUndo||[]).concat(d.snap0).slice(-60);S.mapRedo=[];S.sel={type:'row',id:d.id};touch(p);render();const b=d.orig[0].b;
    toast(`Each bay in this row is now ${+dw(b).toFixed(2)} × ${+dh(b).toFixed(2)} squares${d.snap?', lined up with the next row':''}.`);return;}
  if(d.raf)cancelAnimationFrame(d.raf);
  if(d.type==='lresize'||d.type==='lend'){if(cancel&&d.moved&&S.mapUndo&&S.mapUndo.length)mapRestore(p,S.mapUndo.pop());else if(d.moved)touch(p);S.sel={type:'label',id:d.id};render();return;}
  if(d.type==='draw'){if(cancel){render();return;}const t=d.tool;let l;const ex=d.moved?d.ex:undefined,ey=d.moved?d.ey:undefined;
    if(isLine({type:t})){l={id:uid(),type:t,x:d.gx,y:d.gy,x2:d.moved?ex:d.gx+4,y2:d.moved?ey:d.gy};if(l.x===l.x2&&l.y===l.y2)l.x2+=4;}
    else{const def={text:[6,2],label:[4,1],rect:[4,3],ellipse:[4,3],pallet:[5,3]}[t]||[4,2];let x=d.gx,y=d.gy,w=def[0],h=def[1];
      if(d.moved){x=Math.min(d.gx,ex);y=Math.min(d.gy,ey);w=Math.max(S.mapSnap===false?0.5:1,Math.abs(ex-d.gx));h=Math.max(S.mapSnap===false?0.5:1,Math.abs(ey-d.gy));}
      l={id:uid(),type:t,x,y,w,h,text:t==='text'?'Text':t==='label'?'Label':t==='pallet'?(pallets(p).length?'Pallet '+(pallets(p).length+1):'Temporary pallet'):''};}
    mapSnap(p);p.map.labels.push(l);S.sel={type:'label',id:l.id};S.mapTool='select';if(!isLine(l)&&shType(l)!=='rect'&&shType(l)!=='ellipse')S.focusAfter='lb_text';touch(p);render();return;}
  if(!d.moved||d.ro){if(!cancel){const ns={type:d.type,id:d.id};if(!S.sel||S.sel.type!==ns.type||S.sel.id!==ns.id)S.selEdit=null;S.sel=ns;render();}return;}
  if(cancel){render();return;}
  const C=MAPC*mapScale(),fdx=(e.clientX-d.sx)/C,fdy=(e.clientY-d.sy)/C;mapSnap(p);const before=nameSnapshot(p);let msg='';
  if(d.type==='rack'){const bay=p.racks.find(r=>r.id===d.id);
    if(d.target){swapRacks(p,d.id,d.target);msg='swap';}
    else if(bay){const spot=magnet(p,bay,bay.x+fdx,bay.y+fdy);const ox=bay.x,oy=bay.y;bay.x=Math.max(0,spot.x);bay.y=Math.max(1,spot.y);
      if(p.racks.some(o=>o.id!==bay.id&&overlap(o,bay))){bay.x=ox;bay.y=oy;msg='overlap';}else msg='moved';}
    S.sel={type:'rack',id:d.id};}
  else if(d.type==='row'){const g=groupOfBay(p,d.id);if(g){const dx=Math.round(fdx),dy=Math.round(fdy);const ids=new Set(g.bays.map(b=>b.id));
      const ok=g.bays.every(b=>b.x+dx>=0&&b.y+dy>=1&&!p.racks.some(o=>!ids.has(o.id)&&overlap(o,{x:b.x+dx,y:b.y+dy,orient:b.orient,sw:b.sw,sh:b.sh})));
      if(ok)g.bays.forEach(b=>{b.x+=dx;b.y+=dy;});else msg='overlap';}S.sel={type:'row',id:d.id};}
  else if(d.type==='label'){const l=p.map.labels.find(x=>x.id===d.id);if(l){const mx=snapV(fdx),my=snapV(fdy);const b=shapeBox(l);const ax=Math.max(-b.x,mx),ay=Math.max(-b.y,my);l.x+=ax;l.y+=ay;if(isLine(l)){l.x2+=ax;l.y2+=ay;}}S.sel={type:'label',id:d.id};}
  markUpdated(p,before);touch(p);render();
  const r=d.type==='rack'&&p.racks.find(x=>x.id===d.id);
  if(msg==='overlap')toast('That spot overlaps another bay. Drop it on top of a bay to swap, or next to one to join it.');
  else if(r&&before.get(r.id)!==r.name)toast(`This bay is now ${r.name}; the rack plan has been updated.`);
}
document.addEventListener('pointerup',e=>endDrag(e,false));
addEventListener('afterprint',()=>document.body.classList.remove('print-pallet'));
document.addEventListener('pointercancel',e=>endDrag(e,true));

/* drop a spreadsheet */
['dragenter','dragover'].forEach(ev=>document.addEventListener(ev,e=>{const z=e.target.closest&&e.target.closest('.dropzone');if(!z||!e.dataTransfer||![...(e.dataTransfer.types||[])].includes('Files'))return;e.preventDefault();z.classList.add('over');}));
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.dropzone');if(z&&!z.contains(e.relatedTarget))z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('.dropzone');if(!z)return;e.preventDefault();z.classList.remove('over');const file=e.dataTransfer.files&&e.dataTransfer.files[0];if(file&&z.dataset.pallet)S.palletNext=true;if(file)readSheetFile(file,z.dataset.kind).catch(()=>toast('Couldn’t read that file. Try saving it as .xlsx or .csv.'));});
/* drag to reorder features */
document.addEventListener('dragstart',e=>{const li=e.target.closest&&e.target.closest('#featlist li');if(!li)return;S.drag=li.dataset.feat;e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',S.drag);}catch(_){}});
document.addEventListener('dragover',e=>{const li=e.target.closest&&e.target.closest('#featlist li');if(!li||S.drag==null)return;e.preventDefault();document.querySelectorAll('#featlist li.dragover').forEach(x=>x.classList.remove('dragover'));li.classList.add('dragover');});
document.addEventListener('drop',e=>{const li=e.target.closest&&e.target.closest('#featlist li');if(!li||S.drag==null)return;e.preventDefault();const p=cur();const order=featureOrder(p);
  const from=order.indexOf(S.drag),to=order.indexOf(li.dataset.feat);if(from>=0&&to>=0&&from!==to){const [x]=order.splice(from,1);order.splice(to,0,x);p.options.featureOrder=order;touch(p);}S.drag=null;render();});
document.addEventListener('dragend',()=>{S.drag=null;document.querySelectorAll('#featlist li.dragover').forEach(x=>x.classList.remove('dragover'));});
addEventListener('beforeunload',e=>{if(draftDirty()){e.preventDefault();e.returnValue='';}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'&&draftOn()){e.preventDefault();if(draftDirty()){commitDraft(false);updateSaveState();}return;}
  if(e.key==='Escape'&&S.pop){S.pop=null;render();return;}
  if(S.selEdit&&e.target.closest&&e.target.closest('.edfloat')){if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'){e.preventDefault();const bt=$('[data-act=sel-save]');if(bt)bt.click();return;}if(e.key==='Escape'){S.selEdit=null;render();return;}}
  if(e.key==='Escape'&&S.pngAsk){S.pngAsk=false;render();return;}
  if(e.key==='Escape'&&S.mapPop){S.mapPop=null;render();return;}
  if(S.tab==='map'&&draftOn()&&!S.leaveAsk){const a=document.activeElement;const typing=a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName);const p=cur();
    if(e.key==='Escape'&&S.mapTool&&S.mapTool!=='select'){S.mapTool='select';render();return;}
    if(!typing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();const bt=$(e.shiftKey?'[data-act=map-redo]':'[data-act=map-undo]');if(bt&&!bt.disabled)bt.click();return;}
    if(!typing&&(e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();const bt=$('[data-act=map-redo]');if(bt&&!bt.disabled)bt.click();return;}
    const sl=S.sel&&S.sel.type==='label'&&p?p.map.labels.find(x=>x.id===S.sel.id):null;
    if(sl&&!typing){if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();const bt=$('.edtools [data-act=shape-del]');if(bt)bt.click();return;}
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();const bt=$('.edtools [data-act=shape-dup]');if(bt)bt.click();return;}
      const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key];
      if(mv){e.preventDefault();const st=e.shiftKey||S.mapSnap===false?0.25:1;mapSnap(p);const b=shapeBox(sl);const dx=Math.max(-b.x,mv[0]*st),dy=Math.max(-b.y,mv[1]*st);sl.x+=dx;sl.y+=dy;if(isLine(sl)){sl.x2+=dx;sl.y2+=dy;}touch(p);render();return;}}}
  if(e.key==='Enter'&&S.tab==='moves'&&!S.leaveAsk){const a=document.activeElement;if(!a||!/^(INPUT|SELECT|TEXTAREA|BUTTON)$/.test(a.tagName)){const bt=$('#mmPlaced');if(bt){e.preventDefault();bt.click();return;}}}

  if(e.key==='Enter'&&e.target.id==='gsearch'){e.preventDefault();clearTimeout(LIVE);liveRender('gsearch');}});

function runImport(p){
  const imp=S.imp;const data=dataRows(imp);
  if(!(imp.map.hole>=0)){toast('Match Hole ID to a column first.');return;}
  let{items,extraCols}=buildImport(p,imp,data);
  const stack=[];/* pallet stacking order: the Order column if there is one, else the sheet order */
  const ordKey=it=>{const n=parseFloat(it._ord);return isNaN(n)?Infinity:n;};
  if(imp.mode==='pallet'){const key2=it=>[(it.feature||'').toLowerCase(),(it.hole||'').toLowerCase(),String(it.box||'').toLowerCase()].join('|');const byKey=new Map(p.items.map(it=>[key2(it),it]));let miss=0;
    const pr0=projRec();const saved=pr0&&pr0.plan?new Set(pr0.plan.items.map(x=>x.id)):null;const P0=computePlan(p);
    const stored=m=>(saved&&saved.has(m.id))||!!findPin(p,m.id)||!!m.temp;
    const conf=[];items.forEach(it=>{const m=byKey.get(key2(it))||(!it.feature?p.items.find(x=>(x.hole||'').toLowerCase()===(it.hole||'').toLowerCase()&&String(x.box)===String(it.box)):null);if(m&&stored(m))conf.push({row:it._row,id:m.id,label:boxLabel(m),loc:locText(p,P0,m)});});
    if(conf.length&&!imp.resolved){S.palConf={rows:conf,choice:{}};S.tab='moves';S.mmZoom=true;render();return;}
    const rest=[];items.forEach(it=>{const m=byKey.get(key2(it))||(!it.feature?p.items.find(x=>(x.hole||'').toLowerCase()===(it.hole||'').toLowerCase()&&String(x.box)===String(it.box)):null);
      const ch=imp.resolved&&m&&stored(m)?imp.resolved[it._row]:null;
      if(m&&ch!=='new'){if(ch==='move'){pickForMove(p,P0,m);}stack.push({id:m.id,o:ordKey(it),r:it._row,pal:it._pal});}else{rest.push(it);miss++;}});
    items=rest;imp.pallet=true;imp.skipDup=false;imp._matched=stack.length;}
  if(imp.mode==='replace')p.items=[];
  const colIds={};extraCols.forEach(e=>{let c=p.customCols.find(x=>x.name.toLowerCase()===e.name.toLowerCase());if(!c){c={id:uid(),name:e.name};p.customCols.push(c);}colIds[e.name]=c.id;});
  const key=it=>[(it.feature||'').toLowerCase(),(it.hole||'').toLowerCase(),String(it.box||'').toLowerCase()].join('|');
  const have=new Set(p.items.map(key));let added=0,skipped=0;
  items.forEach(it=>{Object.entries(it._extras).forEach(([n,v])=>{it.custom[colIds[n]]=v;});delete it._extras;
    const o={id:it.id,o:ordKey(it),r:it._row,pal:it._pal};delete it._ord;delete it._pal;delete it._row;
    if(imp.skipDup&&it.box!==''&&have.has(key(it))){skipped++;return;}have.add(key(it));p.items.push(it);added++;stack.push(o);});
  if(imp.pallet&&stack.length){stack.sort((a,b)=>a.o-b.o||a.r-b.r);p.pallet={list:stack.map(x=>({id:x.id,pal:x.pal||''})),file:imp.fileName,when:Date.now()};}
  S.imp=null;
  if(p.stage==='holes'&&added){p.stage='racks';if(p.setup.autoCount===undefined)p.setup.autoCount=true;syncWizardRacks(p);window.scrollTo(0,0);S.focusAfter='wz_rows';}
  if(imp.fromMove){S.tab='moves';const mm=mmState(p);mm.step=1;S.mmZoom=true;S.mmDir='next';window.scrollTo(0,0);}
  touch(p);render();
  if(imp.mode==='pallet')toast(`Pallet order set for ${plural(stack.length,'box','boxes')}${added?` (${added} new ${added===1?'box':'boxes'} added to the move)`:''}`);
  else toast(`Imported ${added} box${added===1?'':'es'}${skipped?`, skipped ${skipped} already in the plan`:''}${imp.pallet&&stack.length?'. Pallet order ready in Move mode':''}`);
}
